name: Content feedback
description: Something in a reading is wrong, misleading or missing a source.
title: '[content] '
labels: ['content-feedback']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reading closely. kloom is written by agents working from sources, and no one can check every line by hand, so a reader's report is how errors get found. Point at the words, say what is wrong, and give a source if you have one.
  - type: input
    id: subject
    attributes:
      label: Subject
      description: Which subject the frame belongs to.
      placeholder: e.g. Chemistry
    validations:
      required: true
  - type: input
    id: frame
    attributes:
      label: Frame
      description: The frame's URL (it is in the address bar) or its id.
      placeholder: e.g. https://…/chemistry/oxygen
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: The text
      description: Quote the words that are wrong, exactly as they appear.
      render: text
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: What the text gets wrong, and what it should say instead if you know.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A book, paper or page that supports the correction, if you have one.
    validations:
      required: false

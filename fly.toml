# The public reader site, kloom.kenhiatt.us (docs/deploying.md §Public reader
# site, korg 3503). One small machine, always on; readers' accounts and data
# live in reader.db on the volume, which a deploy never touches. Deployed by
# `just publish-public` on kai.

app = "kloom-reader"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
ORIGIN = "https://kloom.kenhiatt.us"
KLOOM_PUBLIC_URL = "https://kloom.kenhiatt.us"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = false
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
timeout = "5s"
method = "GET"
path = "/robots.txt"

[mounts]
source = "kloom_data"
destination = "/data"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

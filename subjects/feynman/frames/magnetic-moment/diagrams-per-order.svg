<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Feynman diagrams for the electron's magnetic moment at each order of QED</title>
<desc id="d">Bar chart on a logarithmic scale. The number of vertex diagrams at each order of the calculation of the electron's anomalous magnetic moment: 1 at one loop (Schwinger, 1948), 7 at two loops, 72 at three, 891 at four and 12,672 at five. Data: Aoyama, Kinoshita and Nio (2019).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="237.8" y2="237.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="241.8" text-anchor="end">1</text>
<line x1="64" x2="460" y1="197.5" y2="197.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="201.5" text-anchor="end">10</text>
<line x1="64" x2="460" y1="157.1" y2="157.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="161.1" text-anchor="end">100</text>
<line x1="64" x2="460" y1="116.7" y2="116.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="120.7" text-anchor="end">1,000</text>
<line x1="64" x2="460" y1="76.4" y2="76.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="80.4" text-anchor="end">10,000</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">100,000</text>
</g>
<rect x="75.6" y="237.8" width="56" height="12.2" fill-opacity="0.85"/>
<text x="103.6" y="231.8" text-anchor="middle">1</text>
<text x="103.6" y="266" text-anchor="middle">1 loop</text>
<text x="103.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">α</text>
<rect x="154.8" y="203.7" width="56" height="46.3" fill-opacity="0.85"/>
<text x="182.8" y="197.7" text-anchor="middle">7</text>
<text x="182.8" y="266" text-anchor="middle">2 loops</text>
<text x="182.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">α²</text>
<rect x="234.0" y="162.9" width="56" height="87.1" fill-opacity="0.85"/>
<text x="262.0" y="156.9" text-anchor="middle">72</text>
<text x="262.0" y="266" text-anchor="middle">3 loops</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">α³</text>
<rect x="313.2" y="118.8" width="56" height="131.2" fill-opacity="0.85"/>
<text x="341.2" y="112.8" text-anchor="middle">891</text>
<text x="341.2" y="266" text-anchor="middle">4 loops</text>
<text x="341.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">α⁴</text>
<rect x="392.4" y="72.2" width="56" height="177.8" class="accent" fill="currentColor"/>
<text x="420.4" y="66.2" text-anchor="middle">12,672</text>
<text x="420.4" y="266" text-anchor="middle">5 loops</text>
<text x="420.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">α⁵</text>
<text x="64" y="20" font-size="12" letter-spacing="1">VERTEX DIAGRAMS · LOG SCALE</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Estimates of the chance of losing a Space Shuttle, 1986, against the record (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the odds against losing a shuttle, as 1 in N; a taller bar is a more confident estimate. From Feynman's Appendix F to the Rogers Commission report (1986): solid rockets of all kinds, the range safety officer's count, 1 in 25; mature solid rockets, his estimate, 1 in 50; working engineers, roughly 1 in 100; Marshall engineers on the main engines, 1 in 300; Feynman's own floor for engine surprises, 1 in 500; Rocketdyne engineers on the engines, 1 in 10,000; NASA management, 1 in 100,000. The record of the shuttle program, 1981–2011: 2 losses in 135 flights, about 1 in 68.</desc>

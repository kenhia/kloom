<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Implosion problems finished per month by the Los Alamos punched-card group, as Feynman told it and as the records show</title>
<desc id="d">Bar chart, problems per month. In Feynman's telling, three problems in nine months before he took over (0.33 a month) and nine in three months after (3 a month). In the laboratory's records as Lewis and Archer read them, eight problems between April and December 1944 (about 0.9 a month) and twelve between April and July 1945 (3 a month). Data: Feynman, Los Alamos from Below (1976); Lewis, Trinity by the Numbers (2021); Archer, The Los Alamos Computing Facility during the Manhattan Project (2021).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">

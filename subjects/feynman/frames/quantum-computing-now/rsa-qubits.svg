<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Estimated physical qubits needed to factor a 2048-bit RSA number, 2012–2025</title>
<desc id="d">Bar chart on a logarithmic scale of published estimates, under comparable physical assumptions, of the number of noisy physical qubits a surface-code quantum computer would need to factor a 2048-bit RSA integer with Shor's algorithm. Jones et al. (2012): about 600 million. Fowler et al. (2012): about 1 billion. O'Gorman and Campbell (2017): about 230 million. Gheorghiu and Mosca (2019): about 170 million. Gidney and Ekerå (2019): 20 million. Gidney (2025): 897,864, in under a week. The first four values are read off Gidney's 2025 figure and are approximate. Data: Gidney, arXiv:2505.15917, figure 1 and section 3.2.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">

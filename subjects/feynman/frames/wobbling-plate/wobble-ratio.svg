<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Wobbles per turn of the seal, for a spinning object with a small tilt</title>
<desc id="d">Bar chart. For a symmetric object spinning freely with a small tilt, the tilt goes round I3/I1 times for each turn of a mark on its rim, where I3 is the moment of inertia about the symmetry axis and I1 about a diameter. Feynman's telling: 0.5. A thin disc: 2.00. A coin one-tenth as thick as its radius: 1.99. A hockey puck (25.4 mm thick, 76.2 mm across): 1.74. A cylinder as tall as its radius: 1.50. A cylinder whose height is 1.73 times its radius: 1.00. Computed for kloom from the moments of inertia of a uniform cylinder.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="540" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">0.5</text>
<line x1="64" x2="540" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">1</text>
<line x1="64" x2="540" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">1.5</text>
<line x1="64" x2="540" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">2</text>
</g>
<rect x="81.7" y="196.5" width="44" height="53.5" fill-opacity="0.85"/>
<text x="103.7" y="190.5" text-anchor="middle">0.5</text>
<text x="103.7" y="266" text-anchor="middle">His telling</text>
<text x="103.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">as he told it</text>
<rect x="161.0" y="36.0" width="44" height="214.0" class="accent" fill="currentColor"/>
<text x="183.0" y="30.0" text-anchor="middle">2.00</text>
<text x="183.0" y="266" text-anchor="middle">Thin disc</text>
<text x="183.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">I₃ = 2 I₁</text>
<rect x="240.3" y="36.7" width="44" height="213.3" fill-opacity="0.85"/>
<text x="262.3" y="30.7" text-anchor="middle">1.99</text>
<text x="262.3" y="266" text-anchor="middle">Coin</text>
<text x="262.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">h = R/10</text>
<rect x="319.7" y="63.6" width="44" height="186.4" fill-opacity="0.85"/>
<text x="341.7" y="57.6" text-anchor="middle">1.74</text>
<text x="341.7" y="266" text-anchor="middle">Puck</text>
<text x="341.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">h = 2R/3</text>
<rect x="399.0" y="89.5" width="44" height="160.5" fill-opacity="0.85"/>
<text x="421.0" y="83.5" text-anchor="middle">1.50</text>
<text x="421.0" y="266" text-anchor="middle">Cylinder</text>
<text x="421.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">h = R</text>
<rect x="478.3" y="143.0" width="44" height="107.0" fill-opacity="0.85"/>
<text x="500.3" y="137.0" text-anchor="middle">1.00</text>
<text x="500.3" y="266" text-anchor="middle">Cylinder</text>
<text x="500.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">h = 1.73 R</text>
<text x="64" y="20" font-size="12" letter-spacing="1">WOBBLES PER TURN OF THE SEAL · SMALL TILT</text>
</g></svg>

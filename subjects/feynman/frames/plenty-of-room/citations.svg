<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Citations of "There's Plenty of Room at the Bottom" in the scientific literature, by period</title>
<desc id="d">Bar chart. Citations of Feynman's talk found by Chris Toumey in the Science Citation Index: 3 in the 1960s, 4 in the 1970s, and 63 in the thirteen years after Drexler's 1981 paper. Data: Chris Toumey, Apostolic Succession, Engineering &amp; Science 68, no. 1/2 (2005).</desc>

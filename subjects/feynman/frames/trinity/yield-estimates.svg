<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-labelledby="t d">
<title id="t">Estimates of the Trinity test's yield, 1945 to 2021</title>
<desc id="d">Bar chart, in kilotons of TNT. T Division's forecast before the test, 5 to 10 kilotons (drawn at 7.5); Fermi's dropped paper, about 10; the blast-pressure gauges, 9.9; the first radiochemical assay of the soil, about 18.6; the official Department of Energy figure, 21; Los Alamos's 2021 reassessment, 24.8 plus or minus 2. Data: Carr, Thirty Minutes Before the Dawn (2021), and Wikipedia, Trinity (nuclear test).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="520" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="520" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">10 kt</text>
<line x1="64" x2="520" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">20 kt</text>
<line x1="64" x2="520" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">30 kt</text>
</g>
<rect x="80.0" y="196.5" width="44" height="53.5" fill-opacity="0.85"/>
<text x="102.0" y="190.5" text-anchor="middle">5–10</text>
<text x="102.0" y="266" text-anchor="middle">Forecast</text>
<text x="102.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">T Division</text>
<rect x="156.0" y="178.7" width="44" height="71.3" fill-opacity="0.85"/>
<text x="178.0" y="172.7" text-anchor="middle">~10</text>
<text x="178.0" y="266" text-anchor="middle">Paper</text>
<text x="178.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Fermi</text>
<rect x="232.0" y="179.4" width="44" height="70.6" fill-opacity="0.85"/>
<text x="254.0" y="173.4" text-anchor="middle">9.9</text>
<text x="254.0" y="266" text-anchor="middle">Gauges</text>
<text x="254.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">blast</text>
<rect x="308.0" y="117.3" width="44" height="132.7" fill-opacity="0.85"/>
<text x="330.0" y="111.3" text-anchor="middle">18.6</text>
<text x="330.0" y="266" text-anchor="middle">Soil</text>
<text x="330.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1945 assay</text>
<rect x="384.0" y="100.2" width="44" height="149.8" fill-opacity="0.85"/>
<text x="406.0" y="94.2" text-anchor="middle">21</text>
<text x="406.0" y="266" text-anchor="middle">Official</text>
<text x="406.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">DOE</text>
<rect x="460.0" y="73.1" width="44" height="176.9" class="accent" fill="currentColor"/>
<text x="482.0" y="67.1" text-anchor="middle">24.8</text>
<text x="482.0" y="266" text-anchor="middle">2021</text>
<text x="482.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">reassessed</text>
<text x="64" y="20" font-size="12" letter-spacing="1">TRINITY · YIELD ESTIMATES · KILOTONS OF TNT</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="t d">
<title id="t">Shuttle flights with O-ring thermal distress, by joint temperature at launch, 1981–85</title>
<desc id="d">Bar chart of the share of the 24 shuttle flights before Challenger on which the booster O-rings showed thermal distress (erosion, blow-by or excessive heating), grouped by the O-ring temperature at launch. At 66°F or above: 3 of 20 flights, 15%. At 63°F or below: 4 of 4 flights, 100%. Challenger's joint was estimated at about 28°F. Data: Report of the Presidential Commission on the Space Shuttle Challenger Accident (1986), vol. 1, chapter 6, figures 6 and 7.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="400" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="400" y1="202.2" y2="202.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="206.2" text-anchor="end">25%</text>
<line x1="64" x2="400" y1="154.5" y2="154.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="158.5" text-anchor="end">50%</text>
<line x1="64" x2="400" y1="106.7" y2="106.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="110.7" text-anchor="end">75%</text>
<line x1="64" x2="400" y1="58.9" y2="58.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="62.9" text-anchor="end">100%</text>
</g>
<rect x="116.0" y="221.3" width="64" height="28.7" fill-opacity="0.85"/>
<text x="148.0" y="215.3" text-anchor="middle">15%</text>
<text x="148.0" y="266" text-anchor="middle">66°F+</text>
<text x="148.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">3 of 20</text>
<rect x="284.0" y="58.9" width="64" height="191.1" class="accent" fill="currentColor"/>
<text x="316.0" y="52.9" text-anchor="middle">100%</text>
<text x="316.0" y="266" text-anchor="middle">≤63°F</text>
<text x="316.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">4 of 4</text>
<text x="64" y="20" font-size="12" letter-spacing="1">FLIGHTS WITH O-RING DISTRESS · %</text>
</g></svg>

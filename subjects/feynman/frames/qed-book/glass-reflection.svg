<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Light reflected by a sheet of glass, as the back-surface arrow turns</title>
<desc id="d">Bar chart. Feynman's rule in QED: each surface of the glass contributes an arrow 0.2 long, the front one reversed; the reflected fraction is the square of their sum. As the extra turn of the back arrow goes from 0 to 360 degrees in steps of 45, the reflection is 0, 2.3, 8, 13.7, 16, 13.7, 8, 2.3 and 0 percent. The arithmetic is this frame's.</desc>

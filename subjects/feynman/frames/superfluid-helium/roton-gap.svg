<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">The roton energy gap: Feynman's estimates against the value the data required</title>
<desc id="d">Bar chart. The minimum energy of a roton in liquid helium, in kelvin. Feynman's 1954 estimate from his trial wave function, 19.1 K; the Feynman and Cohen 1956 estimate from an improved wave function, 11.5 K; the value required by thermodynamic data, as quoted by Feynman and Cohen, 9.6 K. Data: R. P. Feynman and M. Cohen, Energy Spectrum of the Excitations in Liquid Helium, Physical Review 102 (1956), abstract.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">5</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">10</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">15</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">20 K</text>
</g>
<rect x="98.0" y="45.6" width="64" height="204.4" fill-opacity="0.85"/>
<text x="130.0" y="39.6" text-anchor="middle">19.1 K</text>
<text x="130.0" y="266" text-anchor="middle">Feynman</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1954</text>
<rect x="230.0" y="127.0" width="64" height="123.0" fill-opacity="0.85"/>
<text x="262.0" y="121.0" text-anchor="middle">11.5 K</text>
<text x="262.0" y="266" text-anchor="middle">Feynman–Cohen</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1956</text>
<rect x="362.0" y="147.3" width="64" height="102.7" class="accent" fill="currentColor"/>
<text x="394.0" y="141.3" text-anchor="middle">9.6 K</text>
<text x="394.0" y="266" text-anchor="middle">Data</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">thermodynamic</text>
<text x="64" y="20" font-size="12" letter-spacing="1">ROTON ENERGY GAP Δ · KELVIN</text>
</g></svg>

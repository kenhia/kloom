<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Labour time per Model T chassis at Highland Park, August 1913 to April 1914</title>
<desc id="d">Bar chart of minutes of labour per chassis: 748 with stationary assembly in August 1913; 350 with a chassis drawn by rope and windlass; 177 on the first moving line, 7 October 1913; 158 on 1 December 1913; 93 on three chain-driven lines, 30 April 1914. Data: Arnold and Faurote, Ford Methods and the Ford Shops (1915), pp. 136–139.</desc>

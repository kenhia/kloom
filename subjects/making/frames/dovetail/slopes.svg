<text x="456.4" y="213.6" text-anchor="middle">7.1°</text>
<text x="456.4" y="266" text-anchor="middle">1 in 8</text>
<text x="456.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">late 1700s</text>
<text x="64" y="20" font-size="12" letter-spacing="1">THE ANGLE OF A DOVETAIL'S SIDE · DEGREES</text>

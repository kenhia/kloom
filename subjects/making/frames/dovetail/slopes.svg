<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">The dovetail's slope through furniture history, after Clive Edwards</title>
<desc id="d">Bar chart of the angle of a dovetail's sides, worked out from the slopes that the furniture historian Clive Edwards gives for each period. The earliest dovetails, about 1 in 1, 45 degrees. Seventeenth- and early eighteenth-century work, often 1 in 3, 18.4 degrees. Later machine-cut dovetails, commonly 1 in 4, 14 degrees. The slope generally accepted as strongest, 1 in 6, 9.5 degrees. Fine later eighteenth-century work, 1 in 8, 7.1 degrees. The angles are this frame's arithmetic, the arctangent of each slope.</desc>

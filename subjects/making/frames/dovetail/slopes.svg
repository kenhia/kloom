<text x="194.8" y="266" text-anchor="middle">1 in 3</text>
<text x="194.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1600s</text>
<rect x="252.0" y="190.1" width="60" height="59.9" fill-opacity="0.85"/>
<text x="282.0" y="184.1" text-anchor="middle">14°</text>
<text x="282.0" y="266" text-anchor="middle">1 in 4</text>
<text x="282.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">machine</text>
<rect x="339.2" y="209.3" width="60" height="40.7" class="accent" fill="currentColor"/>
<text x="369.2" y="203.3" text-anchor="middle">9.5°</text>
<text x="369.2" y="266" text-anchor="middle">1 in 6</text>
<text x="369.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">strongest?</text>

<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="500" y1="185.8" y2="185.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="189.8" text-anchor="end">15</text>
<line x1="64" x2="500" y1="121.6" y2="121.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="125.6" text-anchor="end">30</text>
<line x1="64" x2="500" y1="57.4" y2="57.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="61.4" text-anchor="end">45</text>
</g>

<text x="107.6" y="51.4" text-anchor="middle">45°</text>
<text x="107.6" y="266" text-anchor="middle">1 in 1</text>
<text x="107.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">earliest</text>
<rect x="164.8" y="171.2" width="60" height="78.8" fill-opacity="0.85"/>

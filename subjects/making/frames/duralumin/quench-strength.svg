<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Duralumin's strength after ageing, by the temperature it was quenched from</title>
<desc id="d">Bar chart of the ultimate tensile strength of duralumin sheet (alloy C8 of Merica, Waltenberg and Scott, 1919), quenched in water from eight temperatures and aged 11 to 13 days at 20 °C. From 371 °C, 184 megapascals; 422 °C, 275; 478 °C, 322; 500 °C, 328; 510 °C, 307; 520 °C, 308; 525 °C, 319; 533 °C, 260, where the metal had begun to melt. Each value is the mean of the two or four tests the paper's Table 3 gives, converted from pounds per square inch.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="t d">
<title id="t">Hours to fell an oak in the Ergersheim experiments</title>
<desc id="d">Bar chart. In March 2011 volunteers took well over eight hours, over three days, to fell an oak 42 centimetres across with replicas of Early Neolithic stone adzes. In 2012, with better hafts and practice, an oak 55 centimetres across took less than five hours, with up to three people working at once; a comparable oak cut by one experienced man with a copy of a Roman steel axe took a little over an hour. Data: Elburg, Hein, Probst and Walter, EXARC Journal 2015/2.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="400" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="400" y1="207.2" y2="207.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="211.2" text-anchor="end">2</text>
<line x1="64" x2="400" y1="164.4" y2="164.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="168.4" text-anchor="end">4</text>
<line x1="64" x2="400" y1="121.6" y2="121.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="125.6" text-anchor="end">6</text>
<line x1="64" x2="400" y1="78.8" y2="78.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="82.8" text-anchor="end">8</text>
<line x1="64" x2="400" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10</text>
</g>
<rect x="88.0" y="78.8" width="64" height="171.2" fill-opacity="0.85"/>
<text x="120.0" y="72.8" text-anchor="middle">&gt; 8 h</text>
<text x="120.0" y="266" text-anchor="middle">Stone adze</text>
<text x="120.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2011, 42 cm</text>
<rect x="200.0" y="143.0" width="64" height="107.0" class="accent" fill="currentColor"/>
<text x="232.0" y="137.0" text-anchor="middle">&lt; 5 h</text>
<text x="232.0" y="266" text-anchor="middle">Stone adze</text>
<text x="232.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2012, 55 cm</text>
<rect x="312.0" y="228.6" width="64" height="21.4" fill-opacity="0.85"/>
<text x="344.0" y="222.6" text-anchor="middle">≈ 1 h</text>
<text x="344.0" y="266" text-anchor="middle">Steel axe</text>
<text x="344.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2012</text>
<text x="64" y="20" font-size="12" letter-spacing="1">HOURS TO FELL AN OAK</text>
</g></svg>

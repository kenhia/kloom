<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">The smallest feature ASML's lithography machines print, by the light they use (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the smallest feature, in nanometres, that ASML gives for its lithography systems with each light source: mercury g-line (436 nm) about 1,000 nm; mercury i-line (365 nm) 220 nm; krypton fluoride laser (248 nm) 80 nm; argon fluoride laser (193 nm) 38 nm; extreme ultraviolet (13.5 nm) at numerical aperture 0.33, 13 nm; and at numerical aperture 0.55 (High NA), 8 nm. Data: ASML.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">

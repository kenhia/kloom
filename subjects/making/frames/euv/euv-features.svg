<text x="56" y="130.9" text-anchor="end">100</text>
<line x1="64" x2="580" y1="65.4" y2="65.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="69.4" text-anchor="end">1,000</text>
</g>

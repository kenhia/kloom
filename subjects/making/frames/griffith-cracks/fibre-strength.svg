<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Strength of Griffith's glass fibres against their diameter</title>
<desc id="d">Bar chart of the breaking strength of glass fibres of decreasing diameter, from a rod about 1 mm across (172 MPa) to a fibre 4.2 micrometres across (3,434 MPa). Source: A. A. Griffith, The Phenomena of Rupture and Flow in Solids, Philosophical Transactions of the Royal Society A 221 (1921), Table V, converted from thousandths of an inch and pounds per square inch.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="540" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">1,000</text>
<line x1="64" x2="540" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">2,000</text>
<line x1="64" x2="540" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">3,000</text>
<line x1="64" x2="540" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">4,000</text>
</g>
<rect x="72.0" y="240.8" width="52" height="9.2" fill-opacity="0.85"/>
<text x="98.0" y="234.8" text-anchor="middle">172</text>
<text x="98.0" y="266" text-anchor="middle">1,016 µm</text>
<text x="98.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">rod</text>
<rect x="140.0" y="234.4" width="52" height="15.6" fill-opacity="0.85"/>
<text x="166.0" y="228.4" text-anchor="middle">292</text>
<text x="166.0" y="266" text-anchor="middle">107 µm</text>
<rect x="208.0" y="220.6" width="52" height="29.4" fill-opacity="0.85"/>
<text x="234.0" y="214.6" text-anchor="middle">549</text>
<text x="234.0" y="266" text-anchor="middle">51 µm</text>

<text x="302.0" y="200.8" text-anchor="middle">807</text>
<text x="302.0" y="266" text-anchor="middle">24 µm</text>
<rect x="344.0" y="178.0" width="52" height="72.0" fill-opacity="0.85"/>
<text x="370.0" y="172.0" text-anchor="middle">1,345</text>
<text x="370.0" y="266" text-anchor="middle">13 µm</text>
<rect x="412.0" y="127.5" width="52" height="122.5" fill-opacity="0.85"/>
<text x="438.0" y="121.5" text-anchor="middle">2,289</text>
<text x="438.0" y="266" text-anchor="middle">6.6 µm</text>

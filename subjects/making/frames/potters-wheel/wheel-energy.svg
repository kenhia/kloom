<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Energy stored in a wooden wheelhead at the speeds potters use</title>
<desc id="d">Bar chart of the kinetic energy held by a replica Greek wheelhead 0.81 m across and weighing 27.8 kg, treated as a uniform disc, at four speeds. At 50 revolutions a minute, about the slowest smoothing speed measured on it, 31 joules. At 75, a typical throwing speed, 70 joules. At 100, the speed suggested for Uruk wheel-coiling, 125 joules. At 120, the most measured on Egyptian turntable replicas, 180 joules. The energy is this frame's arithmetic, one half I omega squared.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">50</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">100</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">150</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">200</text>
</g>
<rect x="81.5" y="216.8" width="64" height="33.2" fill-opacity="0.85"/>
<text x="113.5" y="210.8" text-anchor="middle">31 J</text>
<text x="113.5" y="266" text-anchor="middle">50 rpm</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">smoothing</text>
<rect x="180.5" y="175.1" width="64" height="74.9" class="accent" fill="currentColor"/>
<text x="212.5" y="169.1" text-anchor="middle">70 J</text>
<text x="212.5" y="266" text-anchor="middle">75 rpm</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">throwing</text>
<rect x="279.5" y="116.2" width="64" height="133.8" fill-opacity="0.85"/>
<text x="311.5" y="110.2" text-anchor="middle">125 J</text>
<text x="311.5" y="266" text-anchor="middle">100 rpm</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Uruk?</text>
<rect x="378.5" y="57.4" width="64" height="192.6" fill-opacity="0.85"/>
<text x="410.5" y="51.4" text-anchor="middle">180 J</text>
<text x="410.5" y="266" text-anchor="middle">120 rpm</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">turntable max</text>
<text x="64" y="20" font-size="12" letter-spacing="1">ENERGY IN THE SPINNING WHEELHEAD · JOULES</text>
</g></svg>

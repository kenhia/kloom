<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="500" y1="173.6" y2="173.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="177.6" text-anchor="end">250</text>
<line x1="64" x2="500" y1="97.1" y2="97.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="101.1" text-anchor="end">500</text>
<line x1="64" x2="500" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">700</text>
</g>

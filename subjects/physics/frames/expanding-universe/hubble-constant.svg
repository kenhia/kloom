<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Estimates of the Hubble constant, 1927–2022</title>
<desc id="d">Bar chart. Estimates of the Hubble constant in kilometres per second per megaparsec. Lemaître (1927): 625. Hubble (1929): 500. Humason, Mayall and Sandage (1956): 180. Sandage (1958): about 75. Planck, from the microwave background (2018): 67.4. SH0ES, from Cepheids and supernovae (2022): 73.0. Data: the table of estimates in Wikipedia's Hubble's law, revision 1376040730; Hubble, PNAS 15 (1929): 168–173.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">

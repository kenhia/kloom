<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 312" role="img" aria-labelledby="t d">
<title id="t">The Hubble constant: early universe against the distance ladder</title>
<desc id="d">Dot-and-whisker chart of the Hubble constant in km/s/Mpc. From the early universe, with the standard model: Planck 2018, 67.4 ± 0.5; SPT-3G, ACT and Planck combined, 2025, 67.19 ± 0.38. From the distance ladder: the Chicago-Carnegie Hubble Program, red giants with HST and JWST, 70.39 ± 1.94 (its statistical and systematic errors combined here in quadrature); SH0ES, Cepheids with HST and JWST, 73.49 ± 0.93; SH0ES, Cepheids and red giants, 73.18 ± 0.88. Data: Planck Collaboration 2020; Camphuis et al. 2025; Freedman et al. 2024; Riess et al. 2025.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">What a steam engine of the 1820s did, against Carnot's limit</title>
<desc id="d">Bar chart of thermal efficiency, the share of the heat taken in that comes out as work. A typical engine of Carnot's day, about 5 to 7 per cent (Wikipedia's figure). The Carnot limit for Carnot's own example, a boiler at 160 °C and a condenser at 40 °C, 27.7 per cent. The Carnot limit for heat falling from a coal fire at 1,000 °C to cooling water at 10 °C, 77.8 per cent. The two limits are this frame's arithmetic, 1 − T₂/T₁ in kelvin, from Carnot's temperatures.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">25</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">50</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">75</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">100</text>
</g>
<rect x="98.0" y="237.2" width="64" height="12.8" fill-opacity="0.85"/>
<text x="130.0" y="231.2" text-anchor="middle">5–7%</text>
<text x="130.0" y="266" text-anchor="middle">Engines</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1820s</text>
<rect x="230.0" y="190.7" width="64" height="59.3" class="accent" fill="currentColor"/>
<text x="262.0" y="184.7" text-anchor="middle">27.7%</text>
<text x="262.0" y="266" text-anchor="middle">160→40 °C</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">limit</text>
<rect x="362.0" y="83.5" width="64" height="166.5" fill-opacity="0.85"/>
<text x="394.0" y="77.5" text-anchor="middle">77.8%</text>
<text x="394.0" y="266" text-anchor="middle">1000→10 °C</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">limit</text>
<text x="64" y="20" font-size="12" letter-spacing="1">HEAT TURNED INTO WORK · PER CENT</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-labelledby="t d">
<title id="t">Fermi's countdown to criticality as Chicago Pile-1 was built, November 1942</title>
<desc id="d">Bar chart of Fermi's measure, the square of the pile's radius divided by the neutron intensity, which falls towards 1 as the pile nears a self-sustaining chain reaction: 390 at the 15th layer, 320 at the 19th, 270 at the 25th and 149 at the 36th. Fermi calculated that it would reach 1 between the 56th and 57th layers; the pile stopped at the 57th. Data: Wikipedia, Chicago Pile-1.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="480" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="480" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">100</text>
<line x1="64" x2="480" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">200</text>
<line x1="64" x2="480" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">300</text>
<line x1="64" x2="480" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">400</text>
</g>
<rect x="81.6" y="41.3" width="48" height="208.7" fill-opacity="0.85"/>
<text x="105.6" y="35.3" text-anchor="middle">390</text>
<text x="105.6" y="266" text-anchor="middle">Layer 15</text>
<rect x="164.8" y="78.8" width="48" height="171.2" fill-opacity="0.85"/>
<text x="188.8" y="72.8" text-anchor="middle">320</text>
<text x="188.8" y="266" text-anchor="middle">Layer 19</text>
<rect x="248.0" y="105.6" width="48" height="144.4" fill-opacity="0.85"/>
<text x="272.0" y="99.6" text-anchor="middle">270</text>
<text x="272.0" y="266" text-anchor="middle">Layer 25</text>
<rect x="331.2" y="170.3" width="48" height="79.7" fill-opacity="0.85"/>
<text x="355.2" y="164.3" text-anchor="middle">149</text>
<text x="355.2" y="266" text-anchor="middle">Layer 36</text>
<rect x="414.4" y="249.5" width="48" height="1.0" class="accent" fill="currentColor"/>
<text x="438.4" y="243.5" text-anchor="middle">1</text>
<text x="438.4" y="266" text-anchor="middle">Layer 57</text>
<text x="438.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">predicted</text>
<text x="64" y="20" font-size="12" letter-spacing="1">CHICAGO PILE-1 · FERMI'S COUNTDOWN · R² ÷ INTENSITY</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Gravitational-wave signals in the LIGO–Virgo–KAGRA catalogue, at each release</title>
<desc id="d">Bar chart. The cumulative number of candidate signals, with a probability of astrophysical origin of at least one half, in the Gravitational-Wave Transient Catalog at each release: GWTC-1 (2018, through the second observing run), 11; GWTC-3 (2021, through the third), 90; GWTC-4.0 (2025, through the first part of the fourth), 218; GWTC-5.0 (2026, through the second part of the fourth), 390. Data: the catalogues' abstracts, arXiv:1811.12907, 2111.03606, 2508.18082 and 2605.27225.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">

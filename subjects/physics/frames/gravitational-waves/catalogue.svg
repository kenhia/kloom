<text x="113.5" y="238.1" text-anchor="middle">11</text>
<text x="113.5" y="266" text-anchor="middle">GWTC-1</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2018 · O1–O2</text>

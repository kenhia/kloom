<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="t d">
<title id="t">The finest detail each satellite could see in the microwave background</title>
<desc id="d">Bar chart on a logarithmic scale. The width of each satellite's beam, in minutes of arc, at its sharpest frequency: COBE's Differential Microwave Radiometer (launched 1989), 7 degrees, or 420 arcminutes; WMAP (2001), 13.2 arcminutes at 94 GHz; Planck (2009), 5 arcminutes at 217 GHz and above. Smaller is sharper. Data: Wikipedia's Cosmic Background Explorer, Wilkinson Microwave Anisotropy Probe and Planck (spacecraft).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="380" y1="230.0" y2="230.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="234.0" text-anchor="end">1′</text>
<line x1="64" x2="380" y1="165.3" y2="165.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="169.3" text-anchor="end">10′</text>
<line x1="64" x2="380" y1="100.7" y2="100.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="104.7" text-anchor="end">100′</text>
<line x1="64" x2="380" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">1000′</text>
</g>
<rect x="84.7" y="60.4" width="64" height="169.6" fill-opacity="0.85"/>
<text x="116.7" y="54.4" text-anchor="middle">420′ (7°)</text>
<text x="116.7" y="246" text-anchor="middle">COBE</text>
<text x="116.7" y="260" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1989</text>
<rect x="190.0" y="157.5" width="64" height="72.5" fill-opacity="0.85"/>
<text x="222.0" y="151.5" text-anchor="middle">13.2′</text>
<text x="222.0" y="246" text-anchor="middle">WMAP</text>
<text x="222.0" y="260" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2001</text>
<rect x="295.3" y="184.8" width="64" height="45.2" class="accent" fill="currentColor"/>
<text x="327.3" y="178.8" text-anchor="middle">5′</text>
<text x="327.3" y="246" text-anchor="middle">Planck</text>
<text x="327.3" y="260" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2009</text>
<text x="64" y="20" font-size="12" letter-spacing="1">BEAM WIDTH · ARCMINUTES · LOG SCALE</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Distance covered in each of four equal times by a ball rolling from rest</title>
<desc id="d">Bar chart of the distance a ball rolling from rest down an inclined plane covers in each of four successive equal times: 1, 3, 5 and 7 units, the odd numbers, so that the total from rest is 1, 4, 9 and 16. Source: Galileo, Two New Sciences (1638), Third Day, Corollary I, in the translation of Henry Crew and Alfonso de Salvio (1914).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">2</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">4</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">6</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">8</text>
</g>
<rect x="85.5" y="223.2" width="56" height="26.8" fill-opacity="0.85"/>
<text x="113.5" y="217.2" text-anchor="middle">1</text>
<text x="113.5" y="266" text-anchor="middle">1st time</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">total 1</text>
<rect x="184.5" y="169.8" width="56" height="80.2" fill-opacity="0.85"/>
<text x="212.5" y="163.8" text-anchor="middle">3</text>
<text x="212.5" y="266" text-anchor="middle">2nd time</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">total 4</text>
<rect x="283.5" y="116.2" width="56" height="133.8" fill-opacity="0.85"/>
<text x="311.5" y="110.2" text-anchor="middle">5</text>
<text x="311.5" y="266" text-anchor="middle">3rd time</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">total 9</text>
<rect x="382.5" y="62.8" width="56" height="187.2" class="accent" fill="currentColor"/>
<text x="410.5" y="56.8" text-anchor="middle">7</text>
<text x="410.5" y="266" text-anchor="middle">4th time</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">total 16</text>
<text x="64" y="20" font-size="12" letter-spacing="1">DISTANCE IN EACH EQUAL TIME · FROM REST</text>
</g></svg>

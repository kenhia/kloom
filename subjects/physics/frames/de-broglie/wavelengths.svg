<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">De Broglie wavelengths, with green light for comparison (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of wavelengths in picometres. Green light, for comparison: 500,000. A thermal neutron: about 180. An electron at 54 electronvolts, as in Davisson and Germer's experiment: 167. An electron in a 100-kilovolt electron microscope: 3.7. A C60 fullerene molecule in the Vienna experiment of 1999: 2.5. The electron values are kloom's, computed from λ = h/p; the neutron and fullerene values are as Wikipedia's Matter wave gives them.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">1</text>
<line x1="64" x2="540" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">100</text>
<line x1="64" x2="540" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">10K</text>
<line x1="64" x2="540" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">1M</text>
</g>
<rect x="83.6" y="46.7" width="56" height="203.3" fill-opacity="0.85"/>
<text x="111.6" y="40.7" text-anchor="middle">500K</text>
<text x="111.6" y="266" text-anchor="middle">Green light</text>
<text x="111.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">for scale</text>
<rect x="178.8" y="169.6" width="56" height="80.4" fill-opacity="0.85"/>
<text x="206.8" y="163.6" text-anchor="middle">~180</text>
<text x="206.8" y="266" text-anchor="middle">Neutron</text>
<text x="206.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">thermal</text>
<rect x="274.0" y="170.7" width="56" height="79.3" class="accent" fill="currentColor"/>
<text x="302.0" y="164.7" text-anchor="middle">167</text>
<text x="302.0" y="266" text-anchor="middle">Electron</text>
<text x="302.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">54 eV</text>
<rect x="369.2" y="229.7" width="56" height="20.3" fill-opacity="0.85"/>
<text x="397.2" y="223.7" text-anchor="middle">3.7</text>
<text x="397.2" y="266" text-anchor="middle">Electron</text>
<text x="397.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">100 kV</text>
<rect x="464.4" y="235.8" width="56" height="14.2" fill-opacity="0.85"/>
<text x="492.4" y="229.8" text-anchor="middle">2.5</text>
<text x="492.4" y="266" text-anchor="middle">C60</text>
<text x="492.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Vienna 1999</text>
<text x="64" y="20" font-size="12" letter-spacing="1">WAVELENGTH · PICOMETERS · LOG SCALE</text>
</g></svg>

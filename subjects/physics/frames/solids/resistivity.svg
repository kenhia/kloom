<text x="103.6" y="266" text-anchor="middle">Copper</text>
<text x="103.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">metal</text>
<rect x="154.8" y="181.3" width="56" height="68.7" class="accent" fill="currentColor"/>

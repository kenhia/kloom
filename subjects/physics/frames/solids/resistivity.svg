<text x="182.8" y="266" text-anchor="middle">Germanium</text>
<text x="182.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">gap 0.67 eV</text>
<rect x="234.0" y="152.0" width="56" height="98.0" class="accent" fill="currentColor"/>

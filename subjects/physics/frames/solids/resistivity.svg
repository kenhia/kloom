<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Resistivity at room temperature: a metal, two semiconductors and two insulators</title>
<desc id="d">Bar chart on a logarithmic scale. Electrical resistivity at about 20 °C, in ohm-metres: copper 1.68 × 10⁻⁸; germanium 0.46; silicon 2,300; diamond about 10¹²; fused quartz 7.5 × 10¹⁷. Data: Wikipedia, Electrical resistivity and conductivity, table of resistivities.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="242.1" y2="242.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="246.1" text-anchor="end">10⁻⁸</text>
<line x1="64" x2="460" y1="194.5" y2="194.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="198.5" text-anchor="end">10⁻²</text>
<line x1="64" x2="460" y1="147.0" y2="147.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="151.0" text-anchor="end">10⁴</text>
<line x1="64" x2="460" y1="99.4" y2="99.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="103.4" text-anchor="end">10¹⁰</text>
<line x1="64" x2="460" y1="51.9" y2="51.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="55.9" text-anchor="end">10¹⁶</text>
</g>
<rect x="75.6" y="240.3" width="56" height="9.7" fill-opacity="0.85"/>

<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">gap 1.14 eV</text>
<rect x="313.2" y="83.6" width="56" height="166.4" fill-opacity="0.85"/>
<text x="341.2" y="77.6" text-anchor="middle">10¹²</text>
<text x="341.2" y="266" text-anchor="middle">Diamond</text>
<text x="341.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">gap 5.5 eV</text>
<rect x="392.4" y="37.0" width="56" height="213.0" fill-opacity="0.85"/>

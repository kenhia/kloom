<title id="t">How precisely the gravitational constant has been known, from Cavendish to CODATA 2022</title>
<desc id="d">Bar chart on a logarithmic scale, relative uncertainty in parts per million. Cavendish, 1798: about 6,000 (0.6%). Poynting, 1891: 5,500. Heyl, 1930: 1,000. Heyl, 1942: 450. NIST, 1986: 120. NIST, 1998: 1,500, after conflicting measurements. CODATA 2014: 46. CODATA 2022: 22. Data: Wikipedia, Gravitational constant (revision cited in the frame); NIST, 2022 CODATA recommended values.</desc>

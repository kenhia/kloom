<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Starlight bent at the Sun's edge: the predictions and the 1919 eclipse plates</title>
<desc id="d">Bar chart. The deflection of a star's light at the Sun's limb, in seconds of arc. Half the full value, the prediction without the curvature of space (Einstein gave 0.83 in 1911), 0.87; Einstein's 1915 prediction, 1.75; the Sobral 4-inch plates as reduced in 1919, 1.98; the Príncipe plates, 1.61; the Sobral astrographic plates as reduced in 1919, 0.93; the same astrographic plates remeasured in 1979, 1.55. Data: D. Kennefick, Not Only Because of Theory (arXiv:0709.0685), quoting G. M. Harvey (1979) and C. W. F. Everitt (1980).</desc>

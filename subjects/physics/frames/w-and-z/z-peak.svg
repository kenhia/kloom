<title id="t">The Z peak for two, three and four kinds of light neutrino</title>
<desc id="d">Line chart of the cross-section for electron–positron collisions to make hadrons, in nanobarns, against collision energy from 88 to 94.5 GeV. Three curves peak at 91.19 GeV: with two light neutrinos at 47.7 nanobarns, with three at 41.5, with four at 36.5. Born-level curves computed for kloom from the Particle Data Group 2025 Z parameters.</desc>

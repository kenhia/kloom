<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-labelledby="t d">
<title id="t">Fusion energy from the National Ignition Facility's best shots, 2021 to 2025</title>
<desc id="d">Bar chart in megajoules of fusion energy per shot: 1.3 on 8 August 2021 (below the laser energy of about 1.9); 3.15 on 5 December 2022, from 2.05 megajoules of laser light, the first to exceed it; 3.88 on 30 July 2023; 5.2 in February 2024, from 2.2; 5.0 on 23 February 2025; 8.6 on 7 April 2025, from 2.08, a target gain of about 4.1. Data: Lawrence Livermore National Laboratory and Wikipedia, National Ignition Facility.</desc>

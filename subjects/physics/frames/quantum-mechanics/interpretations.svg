<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
<title id="t">Favoured interpretation of quantum mechanics among 1,101 researchers, Nature survey, 2025</title>
<desc id="d">Bar chart of the percentage of the 1,101 usable respondents to Nature's 2025 survey of researchers in quantum physics who chose each interpretation as their favoured one. Copenhagen: 36 per cent. Information-based (the wave function represents only information): 17. Many worlds (with consistent histories, grouped in the survey): 15. Pilot wave (de Broglie–Bohm): 7. Spontaneous collapse: 4. Relational: 4. Everything else (other write-ins, none or unknown, shut up and calculate, superdeterminism, retrocausal, QBism): 18. Counted by kloom from Nature's published survey data.</desc>

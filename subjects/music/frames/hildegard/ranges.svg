<title id="t">The ranges of Hildegard of Bingen's chants</title>
<desc id="d">Bar chart counting Hildegard's 76 chants and chant groups by the span of their melody, in diatonic steps, as the Riesencodex gives them: 2 span an octave, 5 a ninth, 10 a tenth, 20 an 11th, 16 a 12th, 13 a 13th, 5 a 14th, 3 a 15th, none a 16th or 17th, 1 an 18th and 1 a 19th. Data: Weston 2022, appendix 1, from Corrigan's edition.</desc>

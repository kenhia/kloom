<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Roughness of two tones across an octave, computed from Helmholtz's rule</title>
<desc id="d">A curve of roughness, computed by us from Helmholtz's rule, for two tones of six partials each, the lower fixed at 264 vibrations a second and the upper sliding through one octave. Roughness is high for small intervals such as the semitone and whole tone, falls past shoulders at the minor and major thirds to a small dip at the fourth, a deep valley at the fifth and a smaller one at the major sixth, and drops almost to zero at the octave.</desc>

<title id="t">Upright pianos and player pianos made in the United States, 1899–1931</title>
<desc id="d">Grouped bar chart, thousands made in each census year. Ordinary uprights: 167 in 1899, 252 in 1904, 321 in 1909, 228 in 1914, 138 in 1919, 88.7 in 1921, 106 in 1923, 87.3 in 1925, 69.9 in 1927, 49.0 in 1929, 18.3 in 1931. Player uprights, reproducing ones included: 0.2, 1.9, 34.5, 84.5, 177.5, 107.3, 183.7, 149.5, 80.5, 18.7 and 1.8. Grands are left out. Data: Census of Manufactures, in Fabricant 1940, appendix B.</desc>

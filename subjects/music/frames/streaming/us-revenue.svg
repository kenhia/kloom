<title id="t">US recorded-music revenue by format, 1999–2025, in 2025 dollars</title>
<desc id="d">Grouped bar chart of wholesale revenue in billions of 2025 dollars, as the RIAA's sales database adjusts it for inflation. Physical: 16.01 in 1999, 10.55 in 2005, 3.10 in 2010, 1.49 in 2015, 0.90 in 2020, 1.38 in 2025. Downloads: none in 1999, 0.95, 2.74, 2.24, 0.60, 0.27. Streaming: none in 1999 and 2005, then 0.52, 2.46, 8.19 and 9.47. Synchronization, 0.41 in 2025, is left out. Data: RIAA U.S. Sales Database.</desc>

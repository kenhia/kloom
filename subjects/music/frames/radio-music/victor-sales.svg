<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
<title id="t">Victor Talking Machine Company records sold a year, 1919–1935, in millions</title>
<desc id="d">Bar chart. Victor sold 30.9 million records in 1919 and a peak of 54.9 million in 1921, then between 25 and 41 million a year through 1929; sales fell to 17.7 million in 1930, 7.1 million in 1931 and a low of 3.1 million in 1932, and were 4.8 million in 1935. Data: Victor's sales by year, an exhibit in RCA v. Decca Records (1943), as printed by Mainspring Press.</desc>

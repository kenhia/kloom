<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Compact discs shipped in the United States, 1985–2025</title>
<desc id="d">Bar chart, millions of CDs shipped (net after returns) in every fifth year: 22.6 in 1985, 286.5 in 1990, 722.9 in 1995, 942.5 in 2000 (the peak), 705.4 in 2005, 225.8 in 2010, 122.9 in 2015, 31.6 in 2020 and 29.5 in 2025. Data: RIAA, in the Statistical Abstract of the United States (1999, table 936; 2012, table 1140) and the RIAA's year-end reports for 2015, 2020 and 2025.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">

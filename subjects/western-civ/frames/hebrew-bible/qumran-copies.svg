<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">The books most often copied among the Dead Sea Scrolls</title>
<desc id="d">Bar chart of the number of manuscripts of each book identified among the Dead Sea Scrolls, for the eight most copied: Psalms 39, Deuteronomy 33, 1 Enoch 25, Genesis 24, Isaiah 22, Jubilees 21, Exodus 18, Leviticus 17. 1 Enoch and Jubilees, highlighted, are outside the later Jewish canon. Data: Wikipedia, Dead Sea Scrolls, after VanderKam and Flint.</desc>

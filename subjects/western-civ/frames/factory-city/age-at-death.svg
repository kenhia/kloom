<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Average age at death by class, Manchester and Rutland, as Chadwick printed it in 1842</title>
<desc id="d">Bar chart of the average age at death of the deceased, in years, by class, from returns printed in Edwin Chadwick's 1842 Report on the Sanitary Condition of the Labouring Population of Great Britain, page 157. Manchester: professional persons and gentry and their families, 38; tradesmen and their families, 20; mechanics, laborers and their families, 17. Rutland: 52, 41 and 38. Averages of ages at death, pulled down by the deaths of young children.</desc>

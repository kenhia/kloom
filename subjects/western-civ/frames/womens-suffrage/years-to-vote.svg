<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Years from Seneca Falls to women's suffrage</title>
<desc id="d">Bar chart of the years from the Seneca Falls convention of 1848 to the vote for women, by our arithmetic from the dates of each country's law. New Zealand 1893, 45 years. Finland 1906, 58. Norway 1913, 65. United Kingdom 1918, for women over thirty with a property qualification, 70. United States 1920, 72. United Kingdom 1928, for all women at twenty-one, 80. France 1944, 96. Switzerland 1971, federal elections, 123.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="540" y1="208.8" y2="208.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="212.8" text-anchor="end">25</text>
<line x1="64" x2="540" y1="167.7" y2="167.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="171.7" text-anchor="end">50</text>
<line x1="64" x2="540" y1="126.5" y2="126.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="130.5" text-anchor="end">75</text>
<line x1="64" x2="540" y1="85.4" y2="85.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="89.4" text-anchor="end">100</text>
<line x1="64" x2="540" y1="44.2" y2="44.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="48.2" text-anchor="end">125</text>
</g>
<rect x="71.8" y="175.9" width="44" height="74.1" fill-opacity="0.85"/>
<text x="93.8" y="169.9" text-anchor="middle">45</text>
<text x="93.8" y="266" text-anchor="middle">NZ</text>
<text x="93.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1893</text>
<rect x="131.2" y="154.5" width="44" height="95.5" fill-opacity="0.85"/>
<text x="153.2" y="148.5" text-anchor="middle">58</text>
<text x="153.2" y="266" text-anchor="middle">Finland</text>
<text x="153.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1906</text>
<rect x="190.8" y="143.0" width="44" height="107.0" fill-opacity="0.85"/>
<text x="212.8" y="137.0" text-anchor="middle">65</text>
<text x="212.8" y="266" text-anchor="middle">Norway</text>
<text x="212.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1913</text>
<rect x="250.2" y="134.8" width="44" height="115.2" fill-opacity="0.85"/>
<text x="272.2" y="128.8" text-anchor="middle">70</text>
<text x="272.2" y="266" text-anchor="middle">UK 30+</text>
<text x="272.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1918</text>
<rect x="309.8" y="131.5" width="44" height="118.5" class="accent" fill="currentColor"/>
<text x="331.8" y="125.5" text-anchor="middle">72</text>
<text x="331.8" y="266" text-anchor="middle">US</text>
<text x="331.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1920</text>
<rect x="369.2" y="118.3" width="44" height="131.7" fill-opacity="0.85"/>
<text x="391.2" y="112.3" text-anchor="middle">80</text>
<text x="391.2" y="266" text-anchor="middle">UK all</text>
<text x="391.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1928</text>
<rect x="428.8" y="92.0" width="44" height="158.0" fill-opacity="0.85"/>
<text x="450.8" y="86.0" text-anchor="middle">96</text>
<text x="450.8" y="266" text-anchor="middle">France</text>
<text x="450.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1944</text>
<rect x="488.2" y="47.5" width="44" height="202.5" fill-opacity="0.85"/>
<text x="510.2" y="41.5" text-anchor="middle">123</text>
<text x="510.2" y="266" text-anchor="middle">Swiss</text>
<text x="510.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1971</text>
<text x="64" y="20" font-size="12" letter-spacing="1">YEARS AFTER SENECA FALLS, 1848</text>

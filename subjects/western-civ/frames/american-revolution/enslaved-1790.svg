<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Enslaved people as a share of each state's population in the first US census, 1790</title>
<desc id="d">Bar chart of the share of each state's people the census of 1790 counted as slaves, from the census return, and for South Carolina, whose line the printed return leaves blank, from the census's later totals. South Carolina 43.0 percent, Virginia 39.1, Georgia 35.5, Maryland 32.2, North Carolina 25.5, Kentucky 16.9, Delaware 15.0, New York 6.3, New Jersey 6.2; the United States as a whole 17.8 percent, 697,697 of 3,929,326. The shares are this frame's arithmetic from the counts.</desc>

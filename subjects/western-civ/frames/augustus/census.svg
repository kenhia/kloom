<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Roman citizens counted at the census, 70/69 BC to AD 14</title>
<desc id="d">Bar chart. 910,000 citizens counted in 70/69 BC; 4,063,000 in 28 BC; 4,233,000 in 8 BC; 4,937,000 in AD 14, the three counts Augustus gives in his Res Gestae, chapter 8.</desc>

<text x="56" y="131.7" text-anchor="end">200</text>
<line x1="64" x2="600" y1="66.6" y2="66.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="70.6" text-anchor="end">300</text>
</g>

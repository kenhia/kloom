<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="t d">
<title id="t">How big were the armies at Constantinople in 1453?</title>
<desc id="d">Bar chart of estimates in thousands of men: Nicolò Barbaro 160; Jacopo Tedaldi 200; George Sphrantzes 200; Isidore of Kiev 300; Leonard of Chios 300; a modern estimate from Ottoman records, 50 to 80; and the defenders, under 8. Data: Wikipedia, Fall of Constantinople.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Christians in the Roman Empire at 40 percent growth a decade, AD 40–350 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of Rodney Stark's projection of the number of Christians, starting from 1,000 in AD 40 and growing 40 percent a decade, worked through by kloom. AD 40, 1,000; 100, 7,530; 150, 40,500; 200, 218,000; 250, 1.17 million; 300, 6.3 million; 350, 33.9 million. A model, not a count: no one counted early Christians.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">

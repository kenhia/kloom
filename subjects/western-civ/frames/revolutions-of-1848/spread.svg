<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-labelledby="t d">
<title id="t">The day of 1848 on which revolution broke out in six European cities</title>
<desc id="d">Bar chart of the day of the year 1848 on which each city rose: Palermo on 12 January (day 12), Paris on 22–24 February (day 55), Vienna on 13 March (day 73), Pest on 15 March (day 75), and Berlin and Milan on 18 March (day 78). Data: Wikipedia, Revolutions of 1848 and the articles on each rising.</desc>

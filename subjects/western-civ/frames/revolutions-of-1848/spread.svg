<text x="56" y="111.3" text-anchor="end">60</text>
<line x1="64" x2="480" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">90</text>

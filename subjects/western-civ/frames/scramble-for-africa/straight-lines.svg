<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Share of Africa's borders running along a parallel or a meridian, by study</title>
<desc id="d">Bar chart. Alesina, Easterly and Matuszeski (2011): 80 percent of African borders follow lines of latitude and longitude. Barbour (1961): 44 percent are parallels or meridians. Paine, Qiu and Ricart-Huguet (2024): such lines are the main feature of 18 percent of bilateral borders. Barbour and Alesina are as Paine and colleagues quote them.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">25%</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">50%</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">75%</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">100%</text>
</g>
<rect x="102.0" y="78.8" width="56" height="171.2" fill-opacity="0.85"/>
<text x="130.0" y="72.8" text-anchor="middle">80%</text>
<text x="130.0" y="266" text-anchor="middle">Alesina</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2011</text>
<rect x="234.0" y="155.8" width="56" height="94.2" fill-opacity="0.85"/>
<text x="262.0" y="149.8" text-anchor="middle">44%</text>
<text x="262.0" y="266" text-anchor="middle">Barbour</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1961</text>
<rect x="366.0" y="211.5" width="56" height="38.5" class="accent" fill="currentColor"/>
<text x="394.0" y="205.5" text-anchor="middle">18%</text>
<text x="394.0" y="266" text-anchor="middle">Paine</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2024</text>
<text x="64" y="20" font-size="12" letter-spacing="1">BORDERS ON A PARALLEL OR MERIDIAN · %</text>
</g></svg>

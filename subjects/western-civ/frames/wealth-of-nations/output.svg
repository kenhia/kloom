<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Nails or pins made by one worker in a day, in Adam Smith's examples (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of what one worker made in a day in the examples of The Wealth of Nations (1776), Book I, chapter 1: a common smith who has never made nails, two or three hundred (250, the middle of the range); a smith used to making nails but not a nailer, eight hundred or a thousand (900); boys who have made nothing but nails, upwards of 2,300; and a man's share in a pin workshop of ten, 4,800 pins.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="500" y1="212.7" y2="212.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="216.7" text-anchor="end">100</text>
<line x1="64" x2="500" y1="141.4" y2="141.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="145.4" text-anchor="end">1,000</text>
<line x1="64" x2="500" y1="70.0" y2="70.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="74.0" text-anchor="end">10,000</text>
</g>
<rect x="88.5" y="184.3" width="60" height="65.7" fill-opacity="0.85"/>
<text x="118.5" y="178.3" text-anchor="middle">250</text>
<text x="118.5" y="266" text-anchor="middle">smith</text>
<text x="118.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">new to nails</text>
<rect x="197.5" y="144.6" width="60" height="105.4" fill-opacity="0.85"/>
<text x="227.5" y="138.6" text-anchor="middle">900</text>
<text x="227.5" y="266" text-anchor="middle">smith</text>
<text x="227.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">used to nails</text>
<rect x="306.5" y="115.6" width="60" height="134.4" fill-opacity="0.85"/>
<text x="336.5" y="109.6" text-anchor="middle">2,300</text>
<text x="336.5" y="266" text-anchor="middle">boys</text>
<text x="336.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">only nails</text>
<rect x="415.5" y="92.8" width="60" height="157.2" class="accent" fill="currentColor"/>
<text x="445.5" y="86.8" text-anchor="middle">4,800</text>
<text x="445.5" y="266" text-anchor="middle">pin shop</text>
<text x="445.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">one man's share</text>
<text x="64" y="20" font-size="12" letter-spacing="1">MADE BY ONE WORKER IN A DAY · LOG SCALE</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">The gap between two runs of the logistic map at r = 4 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the difference between two runs of x → 4x(1 − x), started at 0.3 and 0.300001 (computed for kloom): 0.000001 at the start, 0.00002 after 5 steps, 0.00045 after 10, 0.026 after 15 and 0.91 after 20, when the two runs have nothing in common.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="223.2" y2="223.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="227.2" text-anchor="end">10⁻⁶</text>
<line x1="64" x2="540" y1="169.8" y2="169.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="173.8" text-anchor="end">10⁻⁴</text>
<line x1="64" x2="540" y1="116.2" y2="116.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="120.2" text-anchor="end">10⁻²</text>
<line x1="64" x2="540" y1="62.8" y2="62.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="66.8" text-anchor="end">1</text>
</g>
<rect x="83.6" y="223.2" width="56" height="26.8" fill-opacity="0.85"/>
<text x="111.6" y="217.2" text-anchor="middle">0.000001</text>
<text x="111.6" y="266" text-anchor="middle">Start</text>
<rect x="178.8" y="188.6" width="56" height="61.4" fill-opacity="0.85"/>
<text x="206.8" y="182.6" text-anchor="middle">0.00002</text>
<text x="206.8" y="266" text-anchor="middle">Step 5</text>
<rect x="274.0" y="152.2" width="56" height="97.8" fill-opacity="0.85"/>
<text x="302.0" y="146.2" text-anchor="middle">0.00045</text>
<text x="302.0" y="266" text-anchor="middle">Step 10</text>
<rect x="369.2" y="105.0" width="56" height="145.0" fill-opacity="0.85"/>
<text x="397.2" y="99.0" text-anchor="middle">0.026</text>
<text x="397.2" y="266" text-anchor="middle">Step 15</text>
<rect x="464.4" y="63.9" width="56" height="186.1" class="accent" fill="currentColor"/>

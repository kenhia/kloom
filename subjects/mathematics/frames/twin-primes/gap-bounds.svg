<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Proven bounds on the smallest gap between primes that recurs forever, 2013–2026</title>
<desc id="d">Bar chart on a logarithmic scale of the proven upper bound on the least gap between consecutive primes that occurs infinitely often. Zhang (April 2013): 70,000,000. Polymath8a (2013): 4,680. Maynard (November 2013): 600. Polymath8b (2014): 246. Stadlmann (preprint, August 2026): 240. Charton and others at Axiom Math (preliminary draft, September 2026): 212. The twin prime conjecture would make it 2. The last two had not been refereed on 30 September 2026. Data: the papers and preprints.</desc>

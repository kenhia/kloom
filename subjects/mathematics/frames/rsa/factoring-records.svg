<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" role="img" aria-labelledby="t d">
<title id="t">The largest RSA challenge numbers factored, 1994–2026</title>
<desc id="d">Bar chart of the number of decimal digits in record factorisations of RSA challenge numbers. RSA-129, April 1994: 129 digits. RSA-155, August 1999: 155. RSA-200, May 2005: 200. RSA-768, December 2009: 232. RSA-250, February 2020: 250. RSA-260, September 2026: 260. RSA-896, September 2026: 270. A 2048-bit key, still unfactored, has 617 digits. Data: RSA Laboratories' challenge list and the announcements.</desc>

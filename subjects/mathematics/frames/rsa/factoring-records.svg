<text x="56" y="189.2" text-anchor="end">100</text>
<line x1="64" x2="560" y1="120.3" y2="120.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="124.3" text-anchor="end">200</text>
<line x1="64" x2="560" y1="55.5" y2="55.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="59.5" text-anchor="end">300</text>
</g>

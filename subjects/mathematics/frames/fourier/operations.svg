<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Operations to transform N samples, directly and by the fast Fourier transform</title>
<desc id="d">Bar chart on a logarithmic scale, computed for this frame. For 1,024 samples, the direct calculation takes N², 1,048,576 operations; the fast Fourier transform, by Cooley and Tukey's bound of 2N log₂ N, 20,480. For 8,192 samples: 67,108,864 against 212,992. For 1,048,576 samples: about 1.1 trillion against about 42 million.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">10K</text>
<line x1="64" x2="540" y1="202.4" y2="202.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="206.4" text-anchor="end">1M</text>
<line x1="64" x2="540" y1="154.9" y2="154.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="158.9" text-anchor="end">100M</text>
<line x1="64" x2="540" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">10B</text>
<line x1="64" x2="540" y1="59.8" y2="59.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="63.8" text-anchor="end">1T</text>
</g>
<rect x="79.7" y="202.0" width="48" height="48.0" fill-opacity="0.85"/>
<text x="103.7" y="196.0" text-anchor="middle">1M</text>
<text x="103.7" y="266" text-anchor="middle">direct</text>
<text x="103.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">N=1,024</text>
<rect x="159.0" y="242.6" width="48" height="7.4" class="accent" fill="currentColor"/>
<text x="183.0" y="236.6" text-anchor="middle">20K</text>
<text x="183.0" y="266" text-anchor="middle">FFT</text>
<text x="183.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">N=1,024</text>
<rect x="238.3" y="159.0" width="48" height="91.0" fill-opacity="0.85"/>
<text x="262.3" y="153.0" text-anchor="middle">67M</text>
<text x="262.3" y="266" text-anchor="middle">direct</text>
<text x="262.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">N=8,192</text>
<rect x="317.7" y="218.4" width="48" height="31.6" class="accent" fill="currentColor"/>
<text x="341.7" y="212.4" text-anchor="middle">213K</text>
<text x="341.7" y="266" text-anchor="middle">FFT</text>
<text x="341.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">N=8,192</text>
<rect x="397.0" y="58.8" width="48" height="191.2" fill-opacity="0.85"/>
<text x="421.0" y="52.8" text-anchor="middle">1.1T</text>
<text x="421.0" y="266" text-anchor="middle">direct</text>
<text x="421.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">N=2²⁰</text>
<rect x="476.3" y="163.9" width="48" height="86.1" class="accent" fill="currentColor"/>
<text x="500.3" y="157.9" text-anchor="middle">42M</text>
<text x="500.3" y="266" text-anchor="middle">FFT</text>
<text x="500.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">N=2²⁰</text>
<text x="64" y="20" font-size="12" letter-spacing="1">OPERATIONS · N² AGAINST 2N LOG₂ N · LOG SCALE</text>
</g></svg>

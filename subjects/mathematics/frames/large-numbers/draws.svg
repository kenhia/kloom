<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Draws needed from Bernoulli's urn: his bound and the exact count</title>
<desc id="d">Bar chart. Draws needed from an urn of 3,000 white and 2,000 black pebbles to be sure, at odds of 1,000, 10,000 and 100,000 to 1, that the share of white drawn lies between 29/50 and 31/50. Bernoulli's bound in Ars Conjectandi (1713): 25,550, 31,258 and 36,966. The exact binomial count, computed for kloom: about 6,500, 9,100 and 11,700.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="540" y1="199.0" y2="199.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="203.0" text-anchor="end">10,000</text>
<line x1="64" x2="540" y1="148.1" y2="148.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="152.1" text-anchor="end">20,000</text>
<line x1="64" x2="540" y1="97.1" y2="97.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="101.1" text-anchor="end">30,000</text>
<line x1="64" x2="540" y1="46.2" y2="46.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="50.2" text-anchor="end">40,000</text>
</g>
<rect x="76.7" y="119.8" width="54" height="130.2" class="accent" fill="currentColor"/>
<text x="103.7" y="113.8" text-anchor="middle">25,550</text>
<text x="103.7" y="266" text-anchor="middle">1,000:1</text>
<text x="103.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Bernoulli</text>
<rect x="156.0" y="216.9" width="54" height="33.1" fill-opacity="0.85"/>
<text x="183.0" y="210.9" text-anchor="middle">≈6,500</text>
<text x="183.0" y="266" text-anchor="middle">1,000:1</text>
<text x="183.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">exact</text>
<rect x="235.3" y="90.7" width="54" height="159.3" class="accent" fill="currentColor"/>
<text x="262.3" y="84.7" text-anchor="middle">31,258</text>
<text x="262.3" y="266" text-anchor="middle">10,000:1</text>
<text x="262.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Bernoulli</text>
<rect x="314.7" y="203.6" width="54" height="46.4" fill-opacity="0.85"/>
<text x="341.7" y="197.6" text-anchor="middle">≈9,100</text>
<text x="341.7" y="266" text-anchor="middle">10,000:1</text>
<text x="341.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">exact</text>
<rect x="394.0" y="61.6" width="54" height="188.4" class="accent" fill="currentColor"/>
<text x="421.0" y="55.6" text-anchor="middle">36,966</text>
<text x="421.0" y="266" text-anchor="middle">100,000:1</text>
<text x="421.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Bernoulli</text>
<rect x="473.3" y="190.4" width="54" height="59.6" fill-opacity="0.85"/>
<text x="500.3" y="184.4" text-anchor="middle">≈11,700</text>
<text x="500.3" y="266" text-anchor="middle">100,000:1</text>
<text x="500.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">exact</text>
<text x="64" y="20" font-size="12" letter-spacing="1">DRAWS NEEDED, BY THE ODDS OF BEING WITHIN 1/50</text>
</g></svg>

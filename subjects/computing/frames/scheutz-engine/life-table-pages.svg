<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">How the 600 pages of the English Life Table of 1864 were set</title>
<desc id="d">Bar chart, pages. Of about 600 pages of printed tables, 28 were composed entirely by the Scheutz engine at the General Register Office, 216 partly, and the rest, about 356, were typeset by hand. Data: Swade, Calculation and Tabulation in the Nineteenth Century (2003), from Farr's English Life Table (1864).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">100</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">200</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">300</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">400</text>
</g>
<rect x="98.0" y="235.0" width="64" height="15.0" class="accent" fill="currentColor"/>
<text x="130.0" y="229.0" text-anchor="middle">28</text>
<text x="130.0" y="266" text-anchor="middle">By the engine</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">wholly</text>
<rect x="230.0" y="134.4" width="64" height="115.6" fill-opacity="0.85"/>
<text x="262.0" y="128.4" text-anchor="middle">216</text>
<text x="262.0" y="266" text-anchor="middle">Partly</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">engine and hand</text>
<rect x="362.0" y="59.5" width="64" height="190.5" fill-opacity="0.85"/>
<text x="394.0" y="53.5" text-anchor="middle">about 356</text>
<text x="394.0" y="266" text-anchor="middle">By hand</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">the rest</text>
<text x="64" y="20" font-size="12" letter-spacing="1">ENGLISH LIFE TABLE, 1864 · PAGES</text>
</g></svg>

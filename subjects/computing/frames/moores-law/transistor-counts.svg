<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Transistors on one processor, 1971–2026</title>
<desc id="d">Bar chart on a logarithmic scale. Intel 4004 (1971): 2,300 transistors. Intel 8086 (1978): 29,000. Intel386 DX (1985): 275,000. Pentium (1993): 3.1 million. Pentium 4 (2000): 42 million. Core 2 Duo (2006): 291 million. Apple M1 (2020): 16 billion. Apple M3 Max (2023): 92 billion. Nvidia Rubin GPU (2026, two dies in one package): 336 billion. Data: Intel's Microprocessor Quick Reference Guide, Apple's and Nvidia's announcements.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="580" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">1K</text>
<line x1="64" x2="580" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">1M</text>
<line x1="64" x2="580" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">1B</text>
<line x1="64" x2="580" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">1T</text>
</g>

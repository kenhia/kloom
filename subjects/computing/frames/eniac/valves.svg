<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">5,000</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">10,000</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">15,000</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">20,000</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Valves (vacuum tubes) in the first electronic computing machines</title>
<desc id="d">Bar chart. The Atanasoff–Berry Computer, tested in 1942, had about 300 valves; the Colossus Mark 1 of 1944 about 1,600 and the Mark 2 about 2,400; ENIAC, completed in 1945, 17,468 in the count most often given (Army histories say 18,000 or 19,000); EDVAC, delivered in 1949, 5,937. Data: the Wikipedia articles Atanasoff–Berry computer, Colossus computer and EDVAC.</desc>

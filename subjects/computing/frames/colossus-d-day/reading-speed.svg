<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Letters of cipher text examined per second by the Tunny-breaking machines</title>
<desc id="d">Bar chart, letters examined per second: Heath Robinson, 1,000 to 2,000 (2,000 at best, on short tapes); Colossus Mark 1, 5,000; Colossus Mark 2, 5,000 read and, with five processors testing five positions at once, an effective 25,000. Data: General Report on Tunny (1945), sections 53B and 54C; Wikipedia, Colossus computer, revision cited.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="207.2" y2="207.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="211.2" text-anchor="end">5k</text>
<line x1="64" x2="460" y1="164.4" y2="164.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="168.4" text-anchor="end">10k</text>
<line x1="64" x2="460" y1="121.6" y2="121.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="125.6" text-anchor="end">15k</text>
<line x1="64" x2="460" y1="78.8" y2="78.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="82.8" text-anchor="end">20k</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">25k</text>
</g>
<rect x="98.0" y="232.9" width="64" height="17.1" fill-opacity="0.85"/>
<text x="130.0" y="226.9" text-anchor="middle">2,000</text>
<text x="130.0" y="266" text-anchor="middle">Robinson</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1943</text>
<rect x="230.0" y="207.2" width="64" height="42.8" fill-opacity="0.85"/>
<text x="262.0" y="201.2" text-anchor="middle">5,000</text>
<text x="262.0" y="266" text-anchor="middle">Mark 1</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Feb 1944</text>
<rect x="362.0" y="36.0" width="64" height="214.0" class="accent" fill="currentColor"/>
<text x="394.0" y="30.0" text-anchor="middle">25,000</text>
<text x="394.0" y="266" text-anchor="middle">Mark 2</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1944, effective</text>
<text x="64" y="20" font-size="12" letter-spacing="1">LETTERS EXAMINED PER SECOND</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Worldwide spending on cloud infrastructure services in the second quarter, 2023–2026</title>
<desc id="d">Bar chart, billions of US dollars spent on cloud infrastructure services (IaaS, PaaS and hosted private cloud) worldwide in April to June of each year, as estimated by Synergy Research Group. 2023: about 65 (derived from Synergy's 2024 figure and its stated growth). 2024: 79.1. 2025: 98.8. 2026: 143.4. Data: Synergy Research Group press releases of 1 August 2024, 31 July 2025 and 30 July 2026.</desc>

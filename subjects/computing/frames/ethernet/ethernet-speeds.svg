<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Ethernet's fastest standard rate, 1973–2024</title>
<desc id="d">Bar chart on a logarithmic scale of the top data rate of Ethernet at each step. The experimental Ethernet at Xerox PARC, 1973: 2.94 Mbit/s. IEEE 802.3 (10BASE5), approved 1983: 10 Mbit/s. 802.3u Fast Ethernet, 1995: 100 Mbit/s. 802.3z Gigabit Ethernet, 1998: 1 Gbit/s. 802.3ae, 2002: 10 Gbit/s. 802.3ba, 2010: 100 Gbit/s. 802.3bs, 2017: 400 Gbit/s. 802.3df, 2024: 800 Gbit/s. Dates are IEEE approval dates. Data: IEEE 802.3 and Ethernet, Wikipedia.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">1 Mb</text>
<line x1="64" x2="540" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">100 Mb</text>
<line x1="64" x2="540" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">10 Gb</text>
<line x1="64" x2="540" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">1 Tb</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Energy efficiency of the world's fastest computer, 2002–2026 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the energy efficiency, in billions of floating-point operations per second per watt (gigaflops per watt), of each TOP500 No. 1 system whose power was reported, in the list where it first took first place: Earth Simulator (June 2002) 0.011; Roadrunner (June 2008) 0.44; K computer (June 2011) 0.82; Sunway TaihuLight (June 2016) 6.1; Fugaku (June 2020) 14.7; Frontier (June 2022) 52.2; El Capitan (November 2024) 58.9; LineShine (June 2026) 52.1. Computed from each list's Rmax (HPL benchmark) and reported power. Data: TOP500.org.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="700" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0.001</text>
<line x1="64" x2="700" y1="207.2" y2="207.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="211.2" text-anchor="end">0.01</text>
<line x1="64" x2="700" y1="164.4" y2="164.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="168.4" text-anchor="end">0.1</text>
<line x1="64" x2="700" y1="121.6" y2="121.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="125.6" text-anchor="end">1</text>
<line x1="64" x2="700" y1="78.8" y2="78.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="82.8" text-anchor="end">10</text>
<line x1="64" x2="700" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">100</text>
</g>

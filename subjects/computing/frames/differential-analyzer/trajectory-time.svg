<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Time to compute one 60-second artillery trajectory: by hand, on the Bush differential analyzer, and on ENIAC</title>
<desc id="d">Bar chart on a logarithmic scale, seconds. A skilled person with a desk calculator took about 20 hours (72,000 seconds); the Bush differential analyzer about 15 minutes (900 seconds); ENIAC about 30 seconds. Data: William T. Moye, ENIAC: The Army-Sponsored Revolution (Army Research Laboratory, 1996).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">10 s</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">100 s</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">1,000 s</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">10⁴ s</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10⁵ s</text>
</g>
<rect x="98.0" y="43.6" width="64" height="206.4" fill-opacity="0.85"/>
<text x="130.0" y="37.6" text-anchor="middle">20 h</text>
<text x="130.0" y="266" text-anchor="middle">By hand</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">desk calculator</text>
<rect x="230.0" y="145.4" width="64" height="104.6" class="accent" fill="currentColor"/>
<text x="262.0" y="139.4" text-anchor="middle">15 min</text>
<text x="262.0" y="266" text-anchor="middle">Analyzer</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Bush type</text>
<rect x="362.0" y="224.5" width="64" height="25.5" fill-opacity="0.85"/>
<text x="394.0" y="218.5" text-anchor="middle">30 s</text>
<text x="394.0" y="266" text-anchor="middle">ENIAC</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1946</text>
<text x="64" y="20" font-size="12" letter-spacing="1">ONE 60-SECOND TRAJECTORY · SECONDS, LOG SCALE</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Share of users reaching Google over IPv6, each September, 2010–2026</title>
<desc id="d">Bar chart of the percentage of users reaching Google over IPv6, averaged over 1 to 27 September of each year shown. 2010: 0.2 per cent. 2012: 0.8. 2014: 3.9. 2016: 11.8. 2018: 21.7. 2020: 30.8. 2022: 38.3. 2024: 43.4. 2026: 47.7. Weekends run a few points higher than weekdays. Data: Google IPv6 statistics, daily series, averaged for kloom.</desc>

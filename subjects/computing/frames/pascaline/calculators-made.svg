<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Mechanical calculators made, from Leibniz to the arithmometer</title>
<desc id="d">Bar chart on a logarithmic scale. Leibniz's stepped reckoner: 2 machines. Pascal's calculator: about 20, by 1654. Thomas de Colmar's arithmometer: about 1,000 by his death in 1870, and about 5,500 in all, 1851 to 1915. Data: the Wikipedia articles Pascaline, Stepped reckoner, Charles Xavier Thomas and Arithmometer.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">1</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">10</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">100</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">1,000</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10,000</text>
</g>
<rect x="85.5" y="233.9" width="56" height="16.1" fill-opacity="0.85"/>
<text x="113.5" y="227.9" text-anchor="middle">2</text>
<text x="113.5" y="266" text-anchor="middle">Leibniz</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1694–1706</text>
<rect x="184.5" y="180.4" width="56" height="69.6" fill-opacity="0.85"/>
<text x="212.5" y="174.4" text-anchor="middle">≈20</text>
<text x="212.5" y="266" text-anchor="middle">Pascal</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">to 1654</text>
<rect x="283.5" y="89.5" width="56" height="160.5" fill-opacity="0.85"/>
<text x="311.5" y="83.5" text-anchor="middle">≈1,000</text>
<text x="311.5" y="266" text-anchor="middle">Thomas</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">to 1870</text>
<rect x="382.5" y="49.9" width="56" height="200.1" class="accent" fill="currentColor"/>
<text x="410.5" y="43.9" text-anchor="middle">≈5,500</text>
<text x="410.5" y="266" text-anchor="middle">Arithmometer</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1851–1915</text>
<text x="64" y="20" font-size="12" letter-spacing="1">MACHINES MADE (LOG SCALE)</text>
</g></svg>

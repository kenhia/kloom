<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Main store of the first stored-program machines, in binary digits</title>
<desc id="d">Bar chart on a logarithmic scale of each machine's main (random-access or delay-line) store in binary digits. Manchester Baby, 1948: 32 words of 32 bits, 1,024. EDSAC, 1949: 512 words of 17 bits, 8,704. Ferranti Mark 1, 1951: 8 pages of 64 lines of 20 bits, 10,240. UNIVAC I, 1951: 1,000 words of 12 six-bit characters, 72,000, not counting check pulses. IBM 701, 1952: 2,048 words of 36 bits, 73,728. Data: University of Manchester, University of Cambridge Computer Laboratory, Weik 1955.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">10²</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">10³</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">10⁴</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">10⁵</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10⁶</text>
</g>
<rect x="75.6" y="195.9" width="56" height="54.1" fill-opacity="0.85"/>
<text x="103.6" y="189.9" text-anchor="middle">1,024</text>
<text x="103.6" y="266" text-anchor="middle">Baby</text>
<text x="103.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1948</text>
<rect x="154.8" y="146.2" width="56" height="103.8" fill-opacity="0.85"/>
<text x="182.8" y="140.2" text-anchor="middle">8,704</text>
<text x="182.8" y="266" text-anchor="middle">EDSAC</text>
<text x="182.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1949</text>
<rect x="234.0" y="142.4" width="56" height="107.6" fill-opacity="0.85"/>
<text x="262.0" y="136.4" text-anchor="middle">10,240</text>
<text x="262.0" y="266" text-anchor="middle">Ferranti</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1951</text>
<rect x="313.2" y="97.1" width="56" height="152.9" class="accent" fill="currentColor"/>
<text x="341.2" y="91.1" text-anchor="middle">72,000</text>
<text x="341.2" y="266" text-anchor="middle">UNIVAC I</text>
<text x="341.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1951</text>
<rect x="392.4" y="96.6" width="56" height="153.4" fill-opacity="0.85"/>
<text x="420.4" y="90.6" text-anchor="middle">73,728</text>
<text x="420.4" y="266" text-anchor="middle">IBM 701</text>
<text x="420.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1952</text>
<text x="64" y="20" font-size="12" letter-spacing="1">MAIN STORE · BINARY DIGITS (LOG SCALE)</text>
</g></svg>

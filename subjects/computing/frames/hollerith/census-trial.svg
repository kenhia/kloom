<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Hours taken in the Census Office's 1888 trial of tabulating methods, on 1880 returns from four districts of St. Louis</title>
<desc id="d">Bar chart, hours. Capturing the data: the two rival methods took 144.5 and 100.5 hours, Hollerith's punched cards 72.5 hours. Preparing it for tabulation: the rivals took 44.5 and 55.5 hours, Hollerith's machine 5.5 hours. Data: U.S. Census Bureau, The Hollerith Machine.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">

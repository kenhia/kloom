<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">What calculating engines cost the British Treasury, against a locomotive of the day</title>
<desc id="d">Bar chart, pounds sterling. Difference Engine No. 1, by the final payment to Joseph Clement in August 1834: £17,478. The locomotive John Bull, built by Robert Stephenson and Company in 1831: £784. The price Edvard Scheutz asked in 1857 for a copy of the Swedish engine: £1,200. Data: Swade, Calculation and Tabulation in the Nineteenth Century (2003).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">5,000</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">10,000</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">15,000</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">20,000</text>
</g>
<rect x="98.0" y="63.0" width="64" height="187.0" class="accent" fill="currentColor"/>
<text x="130.0" y="57.0" text-anchor="middle">£17,478</text>
<text x="130.0" y="266" text-anchor="middle">Engine No. 1</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1823–34</text>
<rect x="230.0" y="241.6" width="64" height="8.4" fill-opacity="0.85"/>
<text x="262.0" y="235.6" text-anchor="middle">£784</text>
<text x="262.0" y="266" text-anchor="middle">John Bull</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">locomotive, 1831</text>
<rect x="362.0" y="237.2" width="64" height="12.8" fill-opacity="0.85"/>
<text x="394.0" y="231.2" text-anchor="middle">£1,200</text>
<text x="394.0" y="266" text-anchor="middle">Scheutz copy</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">price asked, 1857</text>
<text x="64" y="20" font-size="12" letter-spacing="1">POUNDS STERLING · 1831–1857</text>
</g></svg>

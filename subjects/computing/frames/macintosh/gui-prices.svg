<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="t d">
<title id="t">The price of a graphical computer, 1981 to 1984</title>
<desc id="d">Bar chart of launch prices of three computers with a bitmapped screen, windows and a mouse: the Xerox Star 8010 workstation, $16,595 (1981); the Apple Lisa, $9,995 (1983); the Apple Macintosh, $2,495 (1984). Data: the Wikipedia articles Xerox Star, Apple Lisa and Macintosh 128K.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="400" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">$0</text>
<line x1="64" x2="400" y1="190.6" y2="190.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="194.6" text-anchor="end">$5,000</text>
<line x1="64" x2="400" y1="131.1" y2="131.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="135.1" text-anchor="end">$10,000</text>
<line x1="64" x2="400" y1="71.7" y2="71.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="75.7" text-anchor="end">$15,000</text>
</g>
<rect x="88.0" y="52.7" width="64" height="197.3" fill-opacity="0.85"/>
<text x="120.0" y="46.7" text-anchor="middle">$16,595</text>
<text x="120.0" y="266" text-anchor="middle">Xerox Star</text>
<text x="120.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1981</text>
<rect x="200.0" y="131.2" width="64" height="118.8" fill-opacity="0.85"/>
<text x="232.0" y="125.2" text-anchor="middle">$9,995</text>
<text x="232.0" y="266" text-anchor="middle">Apple Lisa</text>
<text x="232.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1983</text>
<rect x="312.0" y="220.3" width="64" height="29.7" class="accent" fill="currentColor"/>
<text x="344.0" y="214.3" text-anchor="middle">$2,495</text>
<text x="344.0" y="266" text-anchor="middle">Macintosh</text>
<text x="344.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1984</text>
<text x="64" y="20" font-size="12" letter-spacing="1">LAUNCH PRICE · US DOLLARS OF THE DAY</text>
</g></svg>

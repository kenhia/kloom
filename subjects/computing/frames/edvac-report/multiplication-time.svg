<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Time for one multiplication, from desk calculators to the EDVAC (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale, seconds. The First Draft of a Report on the EDVAC gives 10 seconds for a fast desk calculating machine and 6 seconds for a standard IBM multiplier, and estimates 1 to 1.5 milliseconds for its own design. The Harvard Mark I took about 6 seconds, ENIAC about 2.8 milliseconds for ten digits by ten, and the EDVAC as built averaged 2.9 milliseconds. The machines worked to different numbers of digits. Data: von Neumann, First Draft (1945), sections 5.4–5.5; the Wikipedia articles Harvard Mark I, ENIAC and EDVAC.</desc>

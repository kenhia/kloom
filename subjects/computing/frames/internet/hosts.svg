<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Hosts on the internet, 1981–2019 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the number of internet hosts. August 1981, 213; August 1983, 562; February 1986, 2,308; January 1989, 80,000; January 1992, 727,000; January 1995, 4.85 million; January 2000, 72.4 million; January 2005, 318 million; January 2010, 733 million; January 2019, 1.01 billion. Data: to 1992, Lottor, RFC 1296 (host tables to 1986, then the ZONE program); from 1995, the Internet Systems Consortium's Domain Survey, whose method changed in 1998 and which ended in 2019.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">100</text>
<line x1="64" x2="540" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">10⁴</text>
<line x1="64" x2="540" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">10⁶</text>
<line x1="64" x2="540" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">10⁸</text>
<line x1="64" x2="540" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10¹⁰</text>
</g>

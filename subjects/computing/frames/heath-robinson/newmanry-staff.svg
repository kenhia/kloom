<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Staff of Max Newman's section at Bletchley Park, April 1943 to April 1945</title>
<desc id="d">Bar chart of the Newmanry's staff at six-monthly intervals: 18 in April 1943, 28 in September 1943, 93 in April 1944, 225 in September 1944 and 325 in April 1945, most of them Wrens (16, 16, 28, 180 and 273). Data: General Report on Tunny (1945), section 31B, in Tony Sale's transcript of the Newmanry history.</desc>

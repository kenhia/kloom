<title id="t">Cheapest disk storage per gigabyte, 1956–2023, in constant 2020 US dollars (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the lowest recorded price of hard-disk storage per gigabyte, adjusted for inflation to 2020 dollars. 1956 about $87.5 million; 1966 $8.4 million; 1975 $890,000; 1984 $93,000; 1990 $6,500; 1995 $363; 2000 $6.12; 2005 $0.54; 2010 $0.053; 2015 $0.031; 2023 $0.011. Data: John C. McCallum, adjusted for inflation by Our World in Data (CC BY 4.0), accessed 28 September 2026.</desc>

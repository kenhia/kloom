<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Web sites, June 1993 to January 1996, and in July 2026 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the number of web sites. June 1993, 130; December 1993, 623; June 1994, 2,738; December 1994, 10,022; June 1995, 23,500; January 1996, about 100,000; July 2026, 1,494,915,628. Data: to 1996, Matthew Gray's Wanderer; 2026, Netcraft's Web Server Survey, which counts every host name that answers, by a different method.</desc>

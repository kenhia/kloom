<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Share of page loads in Firefox made over HTTPS, each September, 2014–2026</title>
<desc id="d">Bar chart of the percentage of Firefox page loads that used HTTPS, averaged over September of each year shown (1 to 27 September in 2026), from Firefox telemetry as published by Let's Encrypt. 2014: 32 per cent. 2016: 46. 2017: 62. 2018: 75. 2020: 84. 2022: 82. 2024: 82. 2025: 86. 2026: 81. Data: Let's Encrypt statistics, from Mozilla's Firefox telemetry, averaged for kloom.</desc>

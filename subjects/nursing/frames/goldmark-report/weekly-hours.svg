<title id="t">Weekly hours of duty in 23 training schools, 1919–21</title>
<desc id="d">Bar chart of the number of the 23 training schools studied by the Committee for the Study of Nursing Education whose students worked each band of weekly hours on duty: 51 to 53 hours, 8 schools; 54 to 56, 7; 57 to 59, 6; 60, 2. The median was 54 hours. Data: Nursing and Nursing Education in the United States (1923), table 10.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Black nurses in the US Army Nurse Corps during the Second World War</title>
<desc id="d">Bar chart, nurses. The first quota, in 1940, was 56; the ceiling in 1943 was 160; 247 Black nurses were serving at the end of 1944, and 479 in September 1945, after the quota ended, in a corps of about 50,000. Data: Hine, as reported by JSTOR Daily (56 and 247), and Bellafaire, The Army Nurse Corps, US Army Center of Military History (160 and 479).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">200</text>
<line x1="64" x2="460" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">400</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">600</text>
</g>
<rect x="85.5" y="230.0" width="56" height="20.0" fill-opacity="0.85"/>
<text x="113.5" y="224.0" text-anchor="middle">56</text>
<text x="113.5" y="266" text-anchor="middle">Quota</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1940</text>
<rect x="184.5" y="192.9" width="56" height="57.1" fill-opacity="0.85"/>
<text x="212.5" y="186.9" text-anchor="middle">160</text>
<text x="212.5" y="266" text-anchor="middle">Ceiling</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1943</text>
<rect x="283.5" y="161.9" width="56" height="88.1" fill-opacity="0.85"/>
<text x="311.5" y="155.9" text-anchor="middle">247</text>
<text x="311.5" y="266" text-anchor="middle">Serving</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">end 1944</text>
<rect x="382.5" y="79.2" width="56" height="170.8" class="accent" fill="currentColor"/>
<text x="410.5" y="73.2" text-anchor="middle">479</text>
<text x="410.5" y="266" text-anchor="middle">Serving</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Sept. 1945</text>
<text x="64" y="20" font-size="12" letter-spacing="1">BLACK NURSES IN THE ARMY NURSE CORPS</text>
</g></svg>

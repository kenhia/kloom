<title id="t">Annual rate of mortality per cent among the sick in the hospitals at Scutari, October 1854 to June 1855</title>
<desc id="d">Bar chart, deaths a year per 100 sick, for twelve periods of three to four weeks, each labeled by the day it began. October 1: 148; October 15: 101; November 12: 121; December 10: 202; January 7: 319; February 1: 415; February 25: 235; March 18: 125; April 8: 79; April 29: 60; May 20: 56; June 10: 34. The Sanitary Commission began its work in March 1855. Data: Florence Nightingale, Mortality of the British Army (1858), Table K, figure 2.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Hospices serving Medicare patients, 2019 to 2024</title>
<desc id="d">Bar chart of the number of hospices that provided care to Medicare beneficiaries, from MedPAC's March 2026 report, Table 10-1: 4,840 in 2019, 5,058 in 2020, 5,358 in 2021, 5,899 in 2022, 6,535 in 2023 and 6,706 in 2024, of which 3,435 and 5,497 were for-profit in the first and last years.</desc>

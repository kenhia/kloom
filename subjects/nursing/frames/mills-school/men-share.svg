<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Men as a share of employed US registered nurses, 1970–2025</title>
<desc id="d">Bar chart of the percentage of employed registered nurses in the United States who were men. 1970: 2.7 per cent. 1980: 4.1. 1990: 5.7. 2000: 7.6. 2006: 8.9. 2011: 9.6 (US Census Bureau, from the census and the American Community Survey). 2025: 12.7 (Bureau of Labor Statistics, Current Population Survey annual averages, 87.3 per cent women; a different survey, so not strictly comparable).</desc>

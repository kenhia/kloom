<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Women nurses in the Army's service, June to September 1898</title>
<desc id="d">Bar chart of the number of trained women nurses serving the Army at the end of each month in 1898, by the Surgeon General's count: June 30, 23; July 31, 162; August 31, 924; September 30, 1,065. Data: Sternberg, introduction to the Abstract of Report on the Origin and Spread of Typhoid Fever in U.S. Military Camps during the Spanish War of 1898.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Admissions to the US Cadet Nurse Corps, 1943 to 1945</title>
<desc id="d">Bar chart, students. 36,000 students already in school joined when the Corps began; 50,827 were admitted in fiscal year 1944, 54,396 in fiscal 1945 and 28,220 in fiscal 1946, until admissions ended on 15 October 1945: 169,443 in all. Data: US Public Health Service, The United States Cadet Nurse Corps 1943–1948, 1950.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">20,000</text>
<line x1="64" x2="460" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">40,000</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">60,000</text>
</g>
<rect x="85.5" y="121.6" width="56" height="128.4" fill-opacity="0.85"/>
<text x="113.5" y="115.6" text-anchor="middle">36,000</text>
<text x="113.5" y="266" text-anchor="middle">In school</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">July 1943</text>
<rect x="184.5" y="68.7" width="56" height="181.3" fill-opacity="0.85"/>
<text x="212.5" y="62.7" text-anchor="middle">50,827</text>
<text x="212.5" y="266" text-anchor="middle">FY 1944</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">to June 1944</text>
<rect x="283.5" y="56.0" width="56" height="194.0" class="accent" fill="currentColor"/>
<text x="311.5" y="50.0" text-anchor="middle">54,396</text>
<text x="311.5" y="266" text-anchor="middle">FY 1945</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">to June 1945</text>
<rect x="382.5" y="149.3" width="56" height="100.7" fill-opacity="0.85"/>
<text x="410.5" y="143.3" text-anchor="middle">28,220</text>
<text x="410.5" y="266" text-anchor="middle">FY 1946</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">to Oct. 1945</text>
<text x="64" y="20" font-size="12" letter-spacing="1">CADET NURSE CORPS · ADMISSIONS</text>
</g></svg>

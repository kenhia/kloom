<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Deaths among Copenhagen's bulbar and respiratory polio patients, 1952</title>
<desc id="d">Bar chart of the share of patients needing special treatment for respiratory or swallowing paralysis at the Blegdam Hospital who died, by period of admission, from Lassen's Table I (deaths counted to 1 April 1953): 87 percent of 31 admitted from 24 July to 25 August 1952, before ventilation by hand, then 52, 48, 38, 26 and 36 percent in five groups of 50 admitted from 26 August to 6 November.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="500" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="500" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">25</text>
<line x1="64" x2="500" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">50</text>
<line x1="64" x2="500" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">75</text>
<line x1="64" x2="500" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">100</text>
</g>
<rect x="72.3" y="63.8" width="56" height="186.2" class="accent" fill="currentColor"/>
<text x="100.3" y="57.8" text-anchor="middle">87%</text>
<text x="100.3" y="266" text-anchor="middle">to 25 Aug</text>
<text x="100.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">31</text>
<rect x="145.0" y="138.7" width="56" height="111.3" fill-opacity="0.85"/>
<text x="173.0" y="132.7" text-anchor="middle">52%</text>
<text x="173.0" y="266" text-anchor="middle">to 8 Sep</text>
<text x="173.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">50</text>
<rect x="217.7" y="147.3" width="56" height="102.7" fill-opacity="0.85"/>
<text x="245.7" y="141.3" text-anchor="middle">48%</text>
<text x="245.7" y="266" text-anchor="middle">to 23 Sep</text>
<text x="245.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">50</text>
<rect x="290.3" y="168.7" width="56" height="81.3" fill-opacity="0.85"/>
<text x="318.3" y="162.7" text-anchor="middle">38%</text>
<text x="318.3" y="266" text-anchor="middle">to 5 Oct</text>
<text x="318.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">50</text>
<rect x="363.0" y="194.4" width="56" height="55.6" fill-opacity="0.85"/>
<text x="391.0" y="188.4" text-anchor="middle">26%</text>
<text x="391.0" y="266" text-anchor="middle">to 21 Oct</text>
<text x="391.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">50</text>
<rect x="435.7" y="173.0" width="56" height="77.0" fill-opacity="0.85"/>
<text x="463.7" y="167.0" text-anchor="middle">36%</text>
<text x="463.7" y="266" text-anchor="middle">to 6 Nov</text>
<text x="463.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">50</text>
<text x="64" y="20" font-size="12" letter-spacing="1">PERCENT WHO DIED, BY WHEN ADMITTED</text>
</g></svg>

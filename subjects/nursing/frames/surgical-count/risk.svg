<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">What raised the risk of a retained sponge or instrument</title>
<desc id="d">Bar chart of risk ratios from Gawande and colleagues' case-control study of 54 patients with retained sponges or instruments in Massachusetts, 1985 to 2001: an emergency operation 8.8, an unplanned change in the operation 4.1, and each one-unit increase in body-mass index 1.1.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="228.6" y2="228.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="232.6" text-anchor="end">1</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">5</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10</text>
</g>
<rect x="94.0" y="61.7" width="72" height="188.3" class="accent" fill="currentColor"/>
<text x="130.0" y="55.7" text-anchor="middle">8.8×</text>
<text x="130.0" y="266" text-anchor="middle">Emergency</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">operation</text>
<rect x="226.0" y="162.3" width="72" height="87.7" fill-opacity="0.85"/>
<text x="262.0" y="156.3" text-anchor="middle">4.1×</text>
<text x="262.0" y="266" text-anchor="middle">Unplanned</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">change</text>
<rect x="358.0" y="226.5" width="72" height="23.5" fill-opacity="0.85"/>
<text x="394.0" y="220.5" text-anchor="middle">1.1×</text>
<text x="394.0" y="266" text-anchor="middle">BMI</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">per unit</text>
<text x="64" y="20" font-size="12" letter-spacing="1">RISK RATIO FOR A RETAINED ITEM · GAWANDE 2003</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Bacteria left on Philip Price's hands and arms as he scrubbed, minute by minute, 1938</title>
<desc id="d">Bar chart, thousands of bacteria left on the hands and arms. At the start 2,822; after each minute of scrubbing with soap and brush 1,325, 1,159, 961, 828, 762, 688, 613 and, projected, 550 after eight minutes; after one minute in 78.5 percent alcohol, 319; after seven more minutes of scrubbing, projected, 140. Data: Price, JAMA 111 (1938), table on p. 1994.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Deaths per 100 births in the First Clinic of the Vienna maternity hospital, month by month, 1847</title>
<desc id="d">Bar chart of maternal deaths per 100 births in the First Obstetrical Clinic of the Vienna General Hospital, where medical students were taught, in each month of 1847: January 3.2, February 1.9, March 3.6, April 18.3, May 12.2, June 2.2, July 1.2, August 1.9, September 4.6, October 4.0, November 4.5, December 2.9. Washing in chlorine solution began in the second half of May. Counts from Semmelweis, Die Ätiologie, der Begriff und die Prophylaxis des Kindbettfiebers (1861), tables XV and pp. 55–56; rates worked out from his counts.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Nurse practitioners in the United States, 1979 to 2025</title>
<desc id="d">Bar chart of the number of nurse practitioners in the United States from the American Association of Nurse Practitioners' historical timeline: about 15,000 in 1979, 22,000 to 24,000 in 1983 (drawn at 23,000), about 68,300 in 1999, 106,000 in 2004, 130,000 in 2009, more than 192,000 in 2014, 270,000 in 2019, 355,000 in 2022 and 461,000 in 2025.</desc>

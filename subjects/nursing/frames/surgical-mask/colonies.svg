<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Bacillus prodigiosus colonies on four agar plates after ten minutes' counting aloud, Hübener, 1898</title>
<desc id="d">Bar chart, colonies counted on four agar plates 50 cm below the mouth after ten minutes of counting aloud in an ordinary voice, the mouth first rinsed with a suspension of Bacillus prodigiosus. Without a mask, 362; with the mask covered by one layer of gauze, 20; with two layers, 0. Data: Hübener, Zeitschrift für Hygiene und Infectionskrankheiten 28 (1898), table VII.</desc>

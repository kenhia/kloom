<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Inguinal hernia wounds that suppurated at the Johns Hopkins Hospital, 1889–1899, by closure and gloves</title>
<desc id="d">Bar chart of the share of inguinal hernia operation wounds that suppurated, from Joseph Bloodgood's 1899 report: 116 wounds closed with silk, operator without gloves, 28 suppurated (24.1 per cent); 104 closed with silver wire, operator without gloves, 10 suppurated (9.6 per cent); 226 closed with silver wire with the operator and every assistant gloved, from February 1897, 4 suppurated (1.8 per cent).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">10</text>
<line x1="64" x2="460" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">20</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">30</text>
</g>
<rect x="98.0" y="78.1" width="64" height="171.9" fill-opacity="0.85"/>
<text x="130.0" y="72.1" text-anchor="middle">24.1%</text>
<text x="130.0" y="266" text-anchor="middle">Silk</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">28 of 116</text>
<rect x="230.0" y="181.5" width="64" height="68.5" fill-opacity="0.85"/>
<text x="262.0" y="175.5" text-anchor="middle">9.6%</text>
<text x="262.0" y="266" text-anchor="middle">Silver wire</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">10 of 104</text>
<rect x="362.0" y="237.2" width="64" height="12.8" class="accent" fill="currentColor"/>
<text x="394.0" y="231.2" text-anchor="middle">1.8%</text>
<text x="394.0" y="266" text-anchor="middle">Wire, gloved</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">4 of 226</text>
<text x="64" y="20" font-size="12" letter-spacing="1">HERNIA WOUNDS THAT SUPPURATED · %</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Maternal deaths per thousand births: Martha Ballard against hospitals of her century and the United States</title>
<desc id="d">Bar chart of maternal deaths per 1,000 births, from Table V of Laurel Thatcher Ulrich's A Midwife's Tale. Martha Ballard's deliveries in Hallowell, Maine, 1785 to 1812: 6.1. London lying-in hospital A, 1767 to 1772: 27.5. London hospital B, 1749 to 1770: 21.5. Dublin hospital B, 1757 to 1775: 14.1. The United States in 1930: 6.7, and in 1945: 2.1.</desc>

<title id="t">Deaths of Army nurses overseas by month, 1918</title>
<desc id="d">Bar chart. Deaths of Army Nurse Corps nurses in the American Expeditionary Forces in 1918: 3 in January, 1 in February, none in March or April, 1 in May, 3 in June, 2 in July, 1 in August, 8 in September, 41 in October, 12 in November and 4 in December. Data: The Medical Department of the United States Army in the World War, vol. 13, part 2 (1927), p. 350.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Minutes of every hour of intensive care spent cleaning hands, by our arithmetic</title>
<desc id="d">Bar chart, by our arithmetic from the WHO's 2009 guidelines: an intensive care nurse meets an average of 30 opportunities for hand hygiene an hour, and the WHO times a soap-and-water wash at 40 to 60 seconds and an alcohol rub at 20 to 30 seconds. At every opportunity, washing takes 30 minutes an hour at 60 seconds and 20 minutes at 40 seconds; rubbing takes 15 minutes at 30 seconds and 10 minutes at 20 seconds. The walk to a sink is not counted.</desc>

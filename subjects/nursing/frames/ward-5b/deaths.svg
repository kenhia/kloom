<title id="t">Deaths among people with AIDS in San Francisco by year, 1981–1997</title>
<desc id="d">Bar chart of deaths among people with AIDS in San Francisco each year: 8 in 1981, 32 in 1982, 111 in 1983 (the year Ward 5B opened), 273 in 1984, 534 in 1985, 807 in 1986, 878 in 1987, 1,038 in 1988, 1,278 in 1989, 1,364 in 1990, 1,512 in 1991, 1,639 in 1992, 1,603 in 1993, 1,598 in 1994, 1,486 in 1995, 992 in 1996 and 424 in 1997. Data: San Francisco Department of Public Health, HIV Surveillance Annual Report 2025, table 10.</desc>

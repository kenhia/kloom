<text x="547.8" y="175.9" text-anchor="middle">3.82%</text>
<text x="547.8" y="266" text-anchor="middle">After</text>
<text x="547.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">ON compl.</text>
<text x="64" y="20" font-size="12" letter-spacing="1">PERCENT OF PATIENTS · BEFORE AND AFTER THE CHECKLIST</text>

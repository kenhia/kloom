<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Deaths and complications before and after a surgical safety checklist</title>
<desc id="d">Bar chart of percentages before and after a surgical safety checklist. In the eight-hospital study of Haynes and colleagues (2009), deaths 1.5 percent before and 0.8 after, complications 11.0 before and 7.0 after. In Urbach and colleagues' study of 101 Ontario hospitals (2014), deaths 0.71 before and 0.65 after, complications 3.86 before and 3.82 after; neither Ontario change was significant. The two studies define complications differently. In the chart 8H is the eight-hospital study and ON the Ontario study.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="580" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="580" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">4</text>
<line x1="64" x2="580" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">8</text>
<line x1="64" x2="580" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">12</text>
</g>
<rect x="70.2" y="223.2" width="52" height="26.8" fill-opacity="0.85"/>
<text x="96.2" y="217.2" text-anchor="middle">1.5%</text>
<text x="96.2" y="266" text-anchor="middle">Before</text>
<text x="96.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">8H deaths</text>
<rect x="134.8" y="235.7" width="52" height="14.3" class="accent" fill="currentColor"/>
<text x="160.8" y="229.7" text-anchor="middle">0.8%</text>
<text x="160.8" y="266" text-anchor="middle">After</text>
<text x="160.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">8H deaths</text>
<rect x="199.2" y="53.8" width="52" height="196.2" fill-opacity="0.85"/>
<text x="225.2" y="47.8" text-anchor="middle">11.0%</text>
<text x="225.2" y="266" text-anchor="middle">Before</text>
<text x="225.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">8H compl.</text>
<rect x="263.8" y="125.2" width="52" height="124.8" class="accent" fill="currentColor"/>
<text x="289.8" y="119.2" text-anchor="middle">7.0%</text>
<text x="289.8" y="266" text-anchor="middle">After</text>
<text x="289.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">8H compl.</text>
<rect x="328.2" y="237.3" width="52" height="12.7" fill-opacity="0.85"/>
<text x="354.2" y="231.3" text-anchor="middle">0.71%</text>
<text x="354.2" y="266" text-anchor="middle">Before</text>
<text x="354.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">ON deaths</text>
<rect x="392.8" y="238.4" width="52" height="11.6" class="accent" fill="currentColor"/>
<text x="418.8" y="232.4" text-anchor="middle">0.65%</text>
<text x="418.8" y="266" text-anchor="middle">After</text>
<text x="418.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">ON deaths</text>
<rect x="457.2" y="181.2" width="52" height="68.8" fill-opacity="0.85"/>
<text x="483.2" y="175.2" text-anchor="middle">3.86%</text>
<text x="483.2" y="266" text-anchor="middle">Before</text>
<text x="483.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">ON compl.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Electricity to make or remake a kilogram of aluminium</title>
<desc id="d">Bar chart. Kilowatt-hours per kilogram of aluminium: remelting scrap, about 0.8 (5 per cent of primary production's energy); the theoretical minimum for the Hall–Héroult reaction, 6.23; Faraday's charge at an assumed 4 volts and perfect current efficiency, 11.9; a typical smelter, 15.37. Data: Wikipedia, Hall–Héroult process and Aluminium recycling; the 0.8 and 11.9 are by our arithmetic.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="190.6" y2="190.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="194.6" text-anchor="end">5</text>
<line x1="64" x2="460" y1="131.1" y2="131.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="135.1" text-anchor="end">10</text>
<line x1="64" x2="460" y1="71.7" y2="71.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="75.7" text-anchor="end">15</text>
</g>
<rect x="85.5" y="240.8" width="56" height="9.2" class="accent" fill="currentColor"/>
<text x="113.5" y="234.8" text-anchor="middle">0.8</text>
<text x="113.5" y="266" text-anchor="middle">Recycled</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">remelted scrap</text>
<rect x="184.5" y="175.9" width="56" height="74.1" fill-opacity="0.85"/>
<text x="212.5" y="169.9" text-anchor="middle">6.2</text>
<text x="212.5" y="266" text-anchor="middle">Minimum</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">thermodynamic</text>
<rect x="283.5" y="108.5" width="56" height="141.5" fill-opacity="0.85"/>
<text x="311.5" y="102.5" text-anchor="middle">11.9</text>
<text x="311.5" y="266" text-anchor="middle">At 4 volts</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Faraday's charge</text>
<rect x="382.5" y="67.3" width="56" height="182.7" fill-opacity="0.85"/>
<text x="410.5" y="61.3" text-anchor="middle">15.4</text>
<text x="410.5" y="266" text-anchor="middle">Smelter</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">typical</text>
<text x="64" y="20" font-size="12" letter-spacing="1">KILOWATT-HOURS PER KILOGRAM OF ALUMINUM</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Ammonia at equilibrium at 200 atmospheres, by temperature</title>
<desc id="d">Bar chart of the share of ammonia, by volume, in a mixture of three parts hydrogen to one of nitrogen once it reaches equilibrium at 200 atmospheres. 300 °C, 62.8 per cent; 350 °C, 49.1; 400 °C, 36.3; 450 °C, 25.6; 500 °C, 17.6; 550 °C, 12.0; 600 °C, 8.2. Worked by kloom from the equation for the equilibrium in Fritz Haber's Nobel lecture, treating the gases as ideal.</desc>

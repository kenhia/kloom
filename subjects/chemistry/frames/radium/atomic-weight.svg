<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">The atomic weight Marie Curie found as her radium grew purer</title>
<desc id="d">Bar chart of the atomic weight Marie Curie found for the metal in her chloride, by weighing it as silver chloride, as fractional crystallisation made it more active. Pure barium chloride, her control, 137 to 138; chloride 3,500 times as active as uranium, 140; 7,500 times, 145.8; about a million times, 173.8; nearly pure radium chloride in 1902, 225. Radium's accepted value today, 226, from radium-226. From her thesis, Radio-Active Substances (1904).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="500" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="500" y1="207.2" y2="207.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="211.2" text-anchor="end">50</text>
<line x1="64" x2="500" y1="164.4" y2="164.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="168.4" text-anchor="end">100</text>
<line x1="64" x2="500" y1="121.6" y2="121.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="125.6" text-anchor="end">150</text>
<line x1="64" x2="500" y1="78.8" y2="78.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="82.8" text-anchor="end">200</text>
<line x1="64" x2="500" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">250</text>
</g>
<rect x="72.3" y="132.3" width="56" height="117.7" fill-opacity="0.85"/>
<text x="100.3" y="126.3" text-anchor="middle">137</text>
<text x="100.3" y="266" text-anchor="middle">Barium</text>
<text x="100.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">control</text>
<rect x="145.0" y="130.2" width="56" height="119.8" fill-opacity="0.85"/>
<text x="173.0" y="124.2" text-anchor="middle">140</text>
<text x="173.0" y="266" text-anchor="middle">×3,500</text>
<text x="173.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">uranium</text>
<rect x="217.7" y="125.2" width="56" height="124.8" fill-opacity="0.85"/>
<text x="245.7" y="119.2" text-anchor="middle">145.8</text>
<text x="245.7" y="266" text-anchor="middle">×7,500</text>
<text x="245.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">uranium</text>
<rect x="290.3" y="101.2" width="56" height="148.8" fill-opacity="0.85"/>
<text x="318.3" y="95.2" text-anchor="middle">173.8</text>
<text x="318.3" y="266" text-anchor="middle">×10⁶</text>
<text x="318.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">uranium</text>
<rect x="363.0" y="57.4" width="56" height="192.6" class="accent" fill="currentColor"/>
<text x="391.0" y="51.4" text-anchor="middle">225</text>
<text x="391.0" y="266" text-anchor="middle">Pure</text>
<text x="391.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1902</text>
<rect x="435.7" y="56.5" width="56" height="193.5" fill-opacity="0.85"/>
<text x="463.7" y="50.5" text-anchor="middle">226</text>
<text x="463.7" y="266" text-anchor="middle">Today</text>
<text x="463.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Ra-226</text>
<text x="64" y="20" font-size="12" letter-spacing="1">ATOMIC WEIGHT FOUND, AS THE SAMPLE GREW PURER</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">The plutonium in hand, 1941 to 1945 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale, in micrograms: 0.5 micrograms of plutonium-239, the sample whose slow-neutron fission Kennedy, Seaborg, Segrè and Wahl measured in May 1941; 2.77 micrograms of plutonium oxide, the first weighing, on 10 September 1942; 20 micrograms of plutonium hydroxide in a capillary, September 1942; and about 6 kilograms, six thousand million micrograms, the core of the Fat Man bomb in August 1945. Data: Kennedy et al., Physical Review 70 (1946); Seaborg's Nobel lecture (1951); Wikipedia, Plutonium.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="500" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0.1 µg</text>
<line x1="64" x2="500" y1="172.2" y2="172.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="176.2" text-anchor="end">1 mg</text>
<line x1="64" x2="500" y1="113.8" y2="113.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="117.8" text-anchor="end">1 g</text>
<line x1="64" x2="500" y1="55.5" y2="55.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="59.5" text-anchor="end">1 kg</text>
</g>
<rect x="90.5" y="236.4" width="56" height="13.6" fill-opacity="0.85"/>
<text x="118.5" y="230.4" text-anchor="middle">0.5 µg</text>
<text x="118.5" y="266" text-anchor="middle">May 1941</text>
<text x="118.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">fissioned</text>
<rect x="199.5" y="221.9" width="56" height="28.1" class="accent" fill="currentColor"/>
<text x="227.5" y="215.9" text-anchor="middle">2.77 µg</text>
<text x="227.5" y="266" text-anchor="middle">Sep 1942</text>
<text x="227.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">weighed</text>
<rect x="308.5" y="205.2" width="56" height="44.8" fill-opacity="0.85"/>
<text x="336.5" y="199.2" text-anchor="middle">20 µg</text>
<text x="336.5" y="266" text-anchor="middle">Sep 1942</text>
<text x="336.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">hydroxide</text>
<rect x="417.5" y="40.3" width="56" height="209.7" fill-opacity="0.85"/>
<text x="445.5" y="34.3" text-anchor="middle">~6 kg</text>
<text x="445.5" y="266" text-anchor="middle">Aug 1945</text>
<text x="445.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">a bomb core</text>
<text x="64" y="20" font-size="12" letter-spacing="1">PLUTONIUM IN HAND · MICROGRAMS · LOG SCALE</text>
</g></svg>

<title id="t">Blood lead in US children aged 1 to 5, 1976 to 2016</title>
<desc id="d">Bar chart of the geometric mean blood lead level of US children aged 1 to 5 in each NHANES survey: 15.2 micrograms per decilitre in 1976–80, 3.6 in 1988–91, 2.7 in 1991–94, 1.9 in 1999–2002, 1.6 in 2003–06, 1.3 in 2007–10 and 0.8 in 2011–16. Data: Egan et al., Environmental Health Perspectives 129 (2021).</desc>

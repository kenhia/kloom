<text x="107.6" y="51.1" text-anchor="middle">631</text>
<text x="107.6" y="266" text-anchor="middle">Antimony</text>
<text x="107.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Sb</text>
<rect x="164.8" y="150.0" width="60" height="100.0" fill-opacity="0.85"/>
<text x="194.8" y="144.0" text-anchor="middle">327</text>
<text x="194.8" y="266" text-anchor="middle">Lead</text>
<text x="194.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Pb</text>
<rect x="252.0" y="174.5" width="60" height="75.5" fill-opacity="0.85"/>
<text x="282.0" y="168.5" text-anchor="middle">247</text>
<text x="282.0" y="266" text-anchor="middle">Pb + Sb</text>
<text x="282.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">13% Sb</text>
<rect x="339.2" y="175.1" width="60" height="74.9" fill-opacity="0.85"/>
<text x="369.2" y="169.1" text-anchor="middle">245</text>
<text x="369.2" y="266" text-anchor="middle">Ideal</text>
<text x="369.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">8.8% Sb</text>
<rect x="426.4" y="176.9" width="60" height="73.1" class="accent" fill="currentColor"/>
<text x="456.4" y="170.9" text-anchor="middle">239</text>
<text x="456.4" y="266" text-anchor="middle">+ tin</text>
<text x="456.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">12% Sb 4% Sn</text>
<text x="64" y="20" font-size="12" letter-spacing="1">MELTING POINT · °C</text>

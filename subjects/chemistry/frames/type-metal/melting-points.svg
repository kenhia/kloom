<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Where lead, antimony and their mixtures melt</title>
<desc id="d">Bar chart of melting points in degrees Celsius. Antimony, 631. Lead, 327. Lead with about 13 per cent antimony, the lead–antimony eutectic, 247 (National Bureau of Standards, 1936; Wikipedia gives 252 at 12 per cent). Lead with 12 per cent antimony and 4 per cent tin, the three-metal eutectic, 239 (Berger, after Osamura). The ideal-solution estimate for lead and antimony, from their melting points and heats of melting alone, 245 at 8.8 per cent antimony, is this frame's arithmetic.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="500" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="500" y1="188.9" y2="188.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="192.9" text-anchor="end">200</text>
<line x1="64" x2="500" y1="127.7" y2="127.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="131.7" text-anchor="end">400</text>
<line x1="64" x2="500" y1="66.6" y2="66.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="70.6" text-anchor="end">600</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Adenine and thymine against guanine and cytosine, in Chargaff's DNA of 1950</title>
<desc id="d">Bar chart of the molar ratio of adenine plus thymine to guanine plus cytosine. The tetranucleotide hypothesis predicts 1. Chargaff's analyses, published in Experientia in 1950, give 0.43 for avian tubercle bacilli, 1.38 for ox thymus (first preparation), 1.67 for human sperm (first preparation) and 1.81 for yeast (first preparation). The ratios are this frame's arithmetic from his tables.</desc>

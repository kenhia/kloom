<text x="420.4" y="50.3" text-anchor="middle">1.81</text>
<text x="420.4" y="266" text-anchor="middle">Yeast</text>
<text x="64" y="20" font-size="12" letter-spacing="1">(A + T) / (G + C) · CHARGAFF 1950</text>

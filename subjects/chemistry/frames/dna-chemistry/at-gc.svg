<text x="103.6" y="266" text-anchor="middle">Levene</text>
<text x="103.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">predicted</text>
<rect x="154.8" y="204.0" width="56" height="46.0" fill-opacity="0.85"/>
<text x="182.8" y="198.0" text-anchor="middle">0.43</text>
<text x="182.8" y="266" text-anchor="middle">Tubercle</text>
<text x="182.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">bacilli</text>
<rect x="234.0" y="102.3" width="56" height="147.7" fill-opacity="0.85"/>

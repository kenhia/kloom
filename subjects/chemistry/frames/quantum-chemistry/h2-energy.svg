<title id="t">The hydrogen molecule's bond energy, calculated and measured, to 1935</title>
<desc id="d">Bar chart of the depth of the hydrogen molecule's energy well, in electronvolts, from Pauling and Wilson's table of 1935. Heitler and London's wave function, with Sugiura's integral, 1927: 3.14. Simple molecular orbitals: 3.47. Wang, 1928: 3.76. Rosen, 1931: 4.02. Weinbaum, ionic and polarization terms, 1933: 4.10. James and Coolidge, 1933: 4.72. Measured: 4.72.</desc>

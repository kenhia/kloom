<text x="56" y="254.0" text-anchor="end">1</text>
<line x1="64" x2="500" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">10²</text>
<line x1="64" x2="500" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">10⁴</text>
<line x1="64" x2="500" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10⁶</text>
</g>
<rect x="90.5" y="202.8" width="56" height="47.2" fill-opacity="0.85"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Penicillin made in the United States, 1943–1949 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale, in billions of units of penicillin made in the United States in a year: 1943, 21; 1944, 1,663; 1945, more than 6,800; 1949, 133,229. Data: American Chemical Society, The Discovery and Development of Penicillin 1928–1945, an International Historic Chemical Landmark (1999).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">

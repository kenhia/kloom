<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Moseley's Q for the alpha X-ray line, potassium to zinc</title>
<desc id="d">Bar chart of Q, the square root of an element's alpha X-ray frequency divided by three quarters of the Rydberg frequency, from Moseley's tables of 1913 and 1914. Potassium 17.98, calcium 19.00, titanium 20.99, vanadium 21.96, chromium 22.98, manganese 23.99, iron 24.99, cobalt 26.00, nickel 27.04, copper 28.01, zinc 29.01. Each step is one, except the double step from calcium to titanium, where scandium, element 21, is missing.</desc>

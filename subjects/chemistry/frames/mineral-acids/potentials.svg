<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Why nitric acid takes silver and leaves gold</title>
<desc id="d">Bar chart of standard electrode potentials in volts, from Wikipedia's table of standard electrode potentials. Silver, Ag⁺/Ag, 0.80. Gold held by chloride, AuCl₄⁻/Au, 0.93. Nitrate, NO₃⁻/NO, 0.96, highlighted. Gold alone, Au³⁺/Au, 1.52. A metal whose potential lies below nitrate's is dissolved by nitric acid: silver is, gold alone is not, and gold with chloride just is.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">0.4</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">0.8</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">1.2</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">1.6</text>
</g>
<rect x="81.5" y="143.0" width="64" height="107.0" fill-opacity="0.85"/>
<text x="113.5" y="137.0" text-anchor="middle">0.80</text>
<text x="113.5" y="266" text-anchor="middle">Silver</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Ag⁺/Ag</text>
<rect x="180.5" y="125.6" width="64" height="124.4" fill-opacity="0.85"/>
<text x="212.5" y="119.6" text-anchor="middle">0.93</text>
<text x="212.5" y="266" text-anchor="middle">Gold + Cl⁻</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">AuCl₄⁻/Au</text>
<rect x="279.5" y="121.6" width="64" height="128.4" class="accent" fill="currentColor"/>
<text x="311.5" y="115.6" text-anchor="middle">0.96</text>
<text x="311.5" y="266" text-anchor="middle">Nitrate</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">NO₃⁻/NO</text>
<rect x="378.5" y="46.7" width="64" height="203.3" fill-opacity="0.85"/>
<text x="410.5" y="40.7" text-anchor="middle">1.52</text>
<text x="410.5" y="266" text-anchor="middle">Gold</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Au³⁺/Au</text>
<text x="64" y="20" font-size="12" letter-spacing="1">STANDARD ELECTRODE POTENTIAL · VOLTS</text>
</g></svg>

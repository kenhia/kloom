<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">The electrospray mass spectrum of Salvarsan, by ring size</title>
<desc id="d">Bar chart of the relative intensity of the peaks for arsenic rings (RAs)n in the electrospray mass spectrum of Salvarsan dissolved in water, as Lloyd, Morgan, Nicholson and Ronimus reported in 2005: three arsenic atoms (m/z 550) 100, four (733) 43, five (916) 90, six (1099) 18, seven (1282) 4 and eight (1465) 2. Rings of three and five dominate; the authors warn that the heights are a qualitative guide to the amounts.</desc>

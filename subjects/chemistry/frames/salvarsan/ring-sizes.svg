<text x="56" y="156.7" text-anchor="end">50</text>
<line x1="64" x2="500" y1="104.1" y2="104.1" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="108.1" text-anchor="end">75</text>
<line x1="64" x2="500" y1="55.5" y2="55.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="59.5" text-anchor="end">100</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Copies after 30 cycles of PCR, by efficiency per cycle</title>
<desc id="d">Bar chart on a log scale of the copies made from one DNA duplex in 30 cycles of PCR, if each cycle copies a given fraction of the molecules: 100 per cent, about 1.07 billion; 95 per cent, 502 million; 90 per cent, 231 million; 85 per cent, 104 million, the efficiency Cetus measured in 1985; 80 per cent, 46 million. Worked out for kloom from the formula (1 + E) to the power n.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">10 M</text>
<line x1="64" x2="460" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">100 M</text>
<line x1="64" x2="460" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">1 B</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">10 B</text>
</g>
<rect x="78.6" y="105.1" width="50" height="144.9" class="accent" fill="currentColor"/>
<text x="103.6" y="99.1" text-anchor="middle">1.07 B</text>
<text x="103.6" y="266" text-anchor="middle">100%</text>
<rect x="157.8" y="128.7" width="50" height="121.3" fill-opacity="0.85"/>
<text x="182.8" y="122.7" text-anchor="middle">502 M</text>
<text x="182.8" y="266" text-anchor="middle">95%</text>
<rect x="237.0" y="152.8" width="50" height="97.2" fill-opacity="0.85"/>
<text x="262.0" y="146.8" text-anchor="middle">231 M</text>
<text x="262.0" y="266" text-anchor="middle">90%</text>
<rect x="316.2" y="177.6" width="50" height="72.4" fill-opacity="0.85"/>
<text x="341.2" y="171.6" text-anchor="middle">104 M</text>
<text x="341.2" y="266" text-anchor="middle">85%</text>
<text x="341.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">1985</text>
<rect x="395.4" y="203.0" width="50" height="47.0" fill-opacity="0.85"/>
<text x="420.4" y="197.0" text-anchor="middle">46 M</text>
<text x="420.4" y="266" text-anchor="middle">80%</text>
<text x="64" y="20" font-size="12" letter-spacing="1">COPIES OF ONE DUPLEX AFTER 30 CYCLES</text>
</g></svg>

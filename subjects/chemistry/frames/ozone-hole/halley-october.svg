<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">October ozone at Halley, Antarctica, 1956–2020</title>
<desc id="d">Bar chart of the mean total ozone measured by Dobson spectrophotometer at Halley in October, in Dobson units, for selected years, from the British Antarctic Survey's provisional monthly means: 1956, 313; 1960, 293; 1970, 275; 1980, 226; 1984, 194, the last October before Farman, Gardiner and Shanklin's paper; 1987, 150; 1993, 122, the lowest; 2000, 137; 2010, 184; 2015, 139; 2020, 150 (provisional).</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Fatal attacks of cholera each day near Broad Street, 29 August to 14 September 1854</title>
<desc id="d">Bar chart of the number of fatal attacks of cholera that began on each day from 29 August to 14 September 1854 in the Broad Street outbreak, from John Snow's table: 1, 8, 56, 143, 116, 54, 46, 36, 20, 28, 12, 11, 5, 5, 1, 3, 0. The pump handle was removed on 8 September, when there were 12; the attacks had been falling since 1 September. Source: Snow, On the Mode of Communication of Cholera, 2nd ed. (1855), p. 49.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
<title id="t">Species known in 1692, by John Ray's count, and described species in 2026 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale, in pairs. Beasts and serpents: Ray, about 150; 2026, 28,497 mammals, reptiles and amphibians. Birds: Ray, about 500; 2026, 11,185. Fishes, without shellfish: Ray, about 500; 2026, 37,630. Insects and other bloodless animals: Ray, about 20,000 on the whole earth; 2026, 1,008,355 insects. Plants: Ray, more than 18,000; 2026, 401,452 land plants. Ray's figures are from The Wisdom of God, second edition, 1692; the 2026 figures are the IUCN Red List's Table 1a, version 2026-1, summed by kloom.</desc>

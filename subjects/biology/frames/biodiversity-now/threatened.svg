<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">Share of species threatened with extinction, by group, IUCN Red List version 2026-1</title>
<desc id="d">Bar chart of the best estimate of the percentage of extant species threatened (Critically Endangered, Endangered or Vulnerable, or Extinct in the Wild) in the groups the IUCN Red List has assessed comprehensively, version 2026-1 of July 2026: cycads 71 percent, reef-forming corals 44, amphibians 41, trees 38, sharks, rays and chimaeras 38, conifers 34, mammals 26, freshwater fishes 26, reptiles 21 and birds 11.5.</desc>

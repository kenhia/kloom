<text x="56" y="147.0" text-anchor="end">50</text>
<line x1="64" x2="740" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">75</text>

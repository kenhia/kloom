<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Phage label released from infected bacteria by the blender, Hershey and Chase 1952</title>
<desc id="d">Bar chart of the percentage of each radioactive label found in the fluid after infected E. coli were spun down, from Table V of Hershey and Chase (1952), at 0.6 phage per bacterium. Sulfur-35, in the protein coat: 16 percent without the blender, 81 percent after 2.5 minutes in it. Phosphorus-32, in the DNA: 10 percent without the blender, 21 percent after it.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">25</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">50</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">75</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">100</text>
</g>
<rect x="85.5" y="215.8" width="56" height="34.2" fill-opacity="0.85"/>
<text x="113.5" y="209.8" text-anchor="middle">16%</text>
<text x="113.5" y="266" text-anchor="middle">S-35</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">no blender</text>
<rect x="184.5" y="76.7" width="56" height="173.3" class="accent" fill="currentColor"/>
<text x="212.5" y="70.7" text-anchor="middle">81%</text>
<text x="212.5" y="266" text-anchor="middle">S-35</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2.5 min</text>
<rect x="283.5" y="228.6" width="56" height="21.4" fill-opacity="0.85"/>
<text x="311.5" y="222.6" text-anchor="middle">10%</text>
<text x="311.5" y="266" text-anchor="middle">P-32</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">no blender</text>
<rect x="382.5" y="205.1" width="56" height="44.9" fill-opacity="0.85"/>
<text x="410.5" y="199.1" text-anchor="middle">21%</text>
<text x="410.5" y="266" text-anchor="middle">P-32</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2.5 min</text>
<text x="64" y="20" font-size="12" letter-spacing="1">LABEL RELEASED FROM THE CELLS · PERCENT · TABLE V</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">How many times each letter of an archaic genome was read, 2010 to 2017 (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the average fold coverage of archaic human genomes from the Leipzig group. The Vindija Neanderthal draft of 2010: 1.3. The Denisovan finger bone, 2010: 1.9. The same bone again, 2012: about 30. The Altai Neanderthal, 2014: 52. A Vindija Neanderthal, 2017: about 30.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="500" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">1×</text>
<line x1="64" x2="500" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">10×</text>
<line x1="64" x2="500" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">100×</text>
</g>
<rect x="79.6" y="237.8" width="56" height="12.2" class="accent" fill="currentColor"/>
<text x="107.6" y="231.8" text-anchor="middle">1.3×</text>
<text x="107.6" y="266" text-anchor="middle">Vindija</text>
<text x="107.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2010</text>
<rect x="166.8" y="220.2" width="56" height="29.8" fill-opacity="0.85"/>
<text x="194.8" y="214.2" text-anchor="middle">1.9×</text>
<text x="194.8" y="266" text-anchor="middle">Denisova</text>
<text x="194.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2010</text>
<rect x="254.0" y="91.9" width="56" height="158.1" fill-opacity="0.85"/>
<text x="282.0" y="85.9" text-anchor="middle">~30×</text>
<text x="282.0" y="266" text-anchor="middle">Denisova</text>
<text x="282.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2012</text>
<rect x="341.2" y="66.4" width="56" height="183.6" fill-opacity="0.85"/>
<text x="369.2" y="60.4" text-anchor="middle">52×</text>
<text x="369.2" y="266" text-anchor="middle">Altai</text>
<text x="369.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2014</text>
<rect x="428.4" y="91.9" width="56" height="158.1" fill-opacity="0.85"/>
<text x="456.4" y="85.9" text-anchor="middle">~30×</text>
<text x="456.4" y="266" text-anchor="middle">Vindija</text>
<text x="456.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2017</text>
<text x="64" y="20" font-size="12" letter-spacing="1">FOLD COVERAGE · LOG SCALE</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Bacteria carrying both resistance genes, for each microgram of plasmid DNA, Cohen and colleagues 1973</title>
<desc id="d">Bar chart. Colonies resistant to both tetracycline and kanamycin, per microgram of each plasmid's DNA. Untreated plasmid DNA, 200; cut with the restriction enzyme EcoRI, 70; cut and then joined with DNA ligase, 570.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="188.9" y2="188.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="192.9" text-anchor="end">200</text>
<line x1="64" x2="460" y1="127.7" y2="127.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="131.7" text-anchor="end">400</text>
<line x1="64" x2="460" y1="66.6" y2="66.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="70.6" text-anchor="end">600</text>
</g>
<rect x="94.0" y="188.9" width="72" height="61.1" fill-opacity="0.85"/>
<text x="130.0" y="182.9" text-anchor="middle">200</text>
<text x="130.0" y="266" text-anchor="middle">Untreated</text>
<text x="130.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">two plasmids</text>
<rect x="226.0" y="228.6" width="72" height="21.4" fill-opacity="0.85"/>
<text x="262.0" y="222.6" text-anchor="middle">70</text>
<text x="262.0" y="266" text-anchor="middle">Cut</text>
<text x="262.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">EcoRI</text>
<rect x="358.0" y="75.7" width="72" height="174.3" class="accent" fill="currentColor"/>
<text x="394.0" y="69.7" text-anchor="middle">570</text>
<text x="394.0" y="266" text-anchor="middle">Cut, joined</text>
<text x="394.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">and ligase</text>
<text x="64" y="20" font-size="12" letter-spacing="1">RESISTANT TO BOTH DRUGS, PER MICROGRAM OF DNA</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-labelledby="t d">
<title id="t">Bald eagle breeding pairs in the lower 48 states, 1963 to 2019</title>
<desc id="d">Bar chart on a logarithmic scale. Bald eagle breeding pairs in the 48 contiguous United States: 1963, 487; 1974, 791; 1984, 1,757; 1994, 4,449; 2006, 9,789; 2009, an estimated 30,548; 2018–19, an estimated 71,467. The counts to 2006 are pairs the states found; the last two are the Fish and Wildlife Service's estimates. DDT was banned for most uses at the end of 1972. Data: US Fish and Wildlife Service.</desc>

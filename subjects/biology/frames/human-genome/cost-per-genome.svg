<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Cost of sequencing a human genome, 2001–2022</title>
<desc id="d">Bar chart on a logarithmic scale of the cost of sequencing a human-sized genome at the sequencing centers funded by the US National Human Genome Research Institute. September 2001: $95.3 million. October 2003: $40.2 million. October 2005: $13.8 million. October 2007: $7.1 million. October 2009: $70,333. October 2011: $7,743. October 2013: $5,096. October 2015: $1,245. November 2017: $1,844. November 2019: $695. November 2021: $552. May 2022: $525. The fall steepens after January 2008, when the centers changed to second-generation sequencing machines. Data: NHGRI, DNA Sequencing Costs: Data.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="580" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">$100</text>
<line x1="64" x2="580" y1="188.9" y2="188.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="192.9" text-anchor="end">$10K</text>
<line x1="64" x2="580" y1="127.7" y2="127.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="131.7" text-anchor="end">$1M</text>
<line x1="64" x2="580" y1="66.6" y2="66.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="70.6" text-anchor="end">$100M</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Share of Pasteur's 1860 flasks of boiled yeast water that grew microbes after being opened in each place</title>
<desc id="d">Bar chart, percent of flasks spoiled, by our arithmetic from Pasteur's counts. Paris Observatory courtyard, 11 of 11 (100 percent); its cellars, 1 of 10 (10); countryside at the foot of the Jura, 8 of 20 (40); a mountain of the Jura at 850 meters, 5 of 20 (25); the Montanvert by the Mer de Glace at 2,000 meters, 1 of 20 (5). Data: Pasteur, Annales de chimie et de physique, 1862.</desc>

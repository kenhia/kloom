<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">The seeds left to Daphne Major's finches, 1973–1977</title>
<desc id="d">Bar chart of the average size-and-hardness index of the seeds available to finches on Daphne Major, the square root of a seed's depth in millimeters times its hardness in kilograms-force, averaged over seed numbers. April 1973, 0.84; December 1973, 1.19; July 1975, 1.01; March 1976, 1.03; in the drought, June 1977, 6.53, and December 1977, 5.19. From Boag and Grant (1984), table 2.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-labelledby="t d">
<title id="t">People sterilized under the eugenic sterilization laws of the United States, by state</title>
<desc id="d">Bar chart, people sterilized under state laws passed from 1907 to 1937. California 20,108; Virginia 8,300; North Carolina 6,851; Michigan 3,786; Georgia 3,284; Kansas 3,032; Indiana 2,424; Minnesota 2,350; the other 24 states with laws 15,235. Total 65,370. Data: Lombardo, Journal of Law, Medicine and Ethics, 2023, from Lombardo, Three Generations, No Imbeciles, 2008.</desc>

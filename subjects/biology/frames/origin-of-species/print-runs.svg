<title id="t">Copies printed of the six editions of On the Origin of Species, 1859–1872</title>
<desc id="d">Bar chart. First edition, 1859: 1,250 copies. Second, 1860: 3,000. Third, 1861: 2,000. Fourth, 1866: 1,500. Fifth, 1869: 2,000. Sixth, 1872: 3,000. Data: R. B. Freeman's introduction to the Origin on Darwin Online, from John Murray's accounts.</desc>

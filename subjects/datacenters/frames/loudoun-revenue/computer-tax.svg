<title id="t">Loudoun County's tax on computer equipment, fiscal years 2014–2025</title>
<desc id="d">Bar chart of the business personal property tax Loudoun County collected on computer equipment, actual, in millions of dollars, from its adopted budgets: 68.9 in fiscal 2014, 84.7 in 2015, 117.2 in 2016, 150.5 in 2017, 195.2 in 2018, 255.1 in 2019, 319.9 in 2020, 388.9 in 2021, 476.1 in 2022, 597.9 in 2023, 698.7 in 2024 and 711.3 in 2025. From 2021 the budgets show data centers' equipment on a line of its own, 97 to 98% of the total.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Water consumed per megawatt-hour by generating technology and cooling, medians from Macknick and colleagues, 2012</title>
<desc id="d">Bar chart of median operational water consumption, in gallons per megawatt-hour, from the literature review by Macknick, Newmark, Heath and Hallett (2012): wind 0, utility-scale photovoltaics 1, gas combined cycle with dry cooling 2, gas combined cycle once-through 100, gas combined cycle with a cooling tower 205, coal once-through 250, nuclear once-through 269, nuclear with a cooling tower 672 and coal with a cooling tower 687. Hydropower's median, 4,491, is left off the chart, as the paper's own figures leave it off. Data: Environmental Research Letters 7, 045802, tables 1 and 2.</desc>

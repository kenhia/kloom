<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Electricity used by Google's data centers, 2020–2024</title>
<desc id="d">Bar chart, terawatt-hours of electricity used by Google's data centers each year, as the company reports it: 14.4 in 2020, 17.7 in 2021, 20.8 in 2022, 24.3 in 2023 and 30.8 in 2024. Over the same five years Google says its data centers came to deliver more than six times as much computing power per unit of electricity. Data: Google, 2025 Environmental Report.</desc>

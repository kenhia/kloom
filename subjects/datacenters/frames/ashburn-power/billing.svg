<title id="t">Data center demand billed by Dominion Energy, 2013–2025</title>
<desc id="d">Bar chart of the peak data center demand Dominion Energy billed in its service territory each year, in megawatts, from the company's own presentation to PJM of September 2026: 462 in 2013, 532 in 2014, 636 in 2015, 753 in 2016, 931 in 2017, 1,113 in 2018, 1,421 in 2019, 1,808 in 2020, 2,302 in 2021, 2,767 in 2022, 3,183 in 2023, 3,636 in 2024 and 4,237 in 2025.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Virginia's state sales tax exempted for data centers, fiscal years 2021–2025</title>
<desc id="d">Bar chart of the state share of sales and use tax that Virginia's data center exemption waived each fiscal year, in millions of dollars, as JLARC estimated it from operators' reports: 613.5 in FY2021, 411.5 in FY2022, 685.2 in FY2023, 927.4 in FY2024 and 1,420.0 in FY2025. Local and regional shares are not included. Data: JLARC, Economic Development Incentives 2026, table D-3.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">US data center electricity use, estimated 2014–2023 and projected for 2028</title>
<desc id="d">Bar chart of Lawrence Berkeley National Laboratory's December 2024 estimates of US data center electricity use, in terawatt-hours: about 60 in 2014 and in 2016, 76 in 2018 and 176 in 2023, and its projection for 2028 of 325 in the low scenario and 580 in the high one, 6.7% to 12.0% of US electricity. Data: 2024 United States Data Center Energy Usage Report, figure ES-1.</desc>

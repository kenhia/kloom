<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="t d">
<title id="t">Google's water use at The Dalles, Oregon, 2012–2025</title>
<desc id="d">Bar chart of the water Google's data centers at The Dalles took from the city's system, in millions of gallons a year. From the city's records, released to The Oregonian in December 2022: 104.3 in 2012, 108.9 in 2013, 132.3 in 2014, 148.3 in 2015, 113.1 in 2016, 124.2 in 2017, 150.7 in 2018, 233.3 in 2019, 279.8 in 2020 and 355.1 in 2021. From Google's own environmental reports, as withdrawal, in the accent color: 352.2 in 2022, 383.7 in 2023, 461.1 in 2024 and 654.3 in 2025.</desc>

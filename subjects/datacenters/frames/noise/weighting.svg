<text x="332.4" y="20" font-size="9">A-WEIGHTING SUBTRACTS</text>
<rect x="457.8" y="12" width="8" height="8" class="accent" fill="currentColor"/>
<text x="469.8" y="20" font-size="9">HOUSE REMOVES</text>
<text x="64" y="20" font-size="12" letter-spacing="1">DECIBELS, BY OCTAVE BAND</text>
</g></svg>

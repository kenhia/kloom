<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">What A-weighting subtracts and what a house removes, by octave band</title>
<desc id="d">Grouped bar chart in decibels by octave band. A-weighting subtracts 39 at 31.5 Hz, 26 at 63 Hz, 16 at 125 Hz, 9 at 250 Hz and 0 at 1,000 Hz (IEC 61672, rounded). A typical wood-frame house with windows open about two inches removes 11, 15, 19, 21 and 25 decibels in the same bands (Nelson Acoustics' memorandum to Prince William County, August 2025, table 7).</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="540" y1="202.4" y2="202.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="206.4" text-anchor="end">10</text>
<line x1="64" x2="540" y1="154.9" y2="154.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="158.9" text-anchor="end">20</text>
<line x1="64" x2="540" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">30</text>
<line x1="64" x2="540" y1="59.8" y2="59.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="63.8" text-anchor="end">40</text>
</g>
<rect x="72.5" y="64.5" width="38.1" height="185.5" fill-opacity="0.85"/>
<text x="91.5" y="58.5" text-anchor="middle" font-size="9">39</text>
<rect x="112.6" y="197.7" width="38.1" height="52.3" class="accent" fill="currentColor"/>
<text x="131.7" y="191.7" text-anchor="middle" font-size="9">11</text>
<text x="111.6" y="266" text-anchor="middle">31.5 HZ</text>
<rect x="167.7" y="126.4" width="38.1" height="123.6" fill-opacity="0.85"/>
<text x="186.8" y="120.4" text-anchor="middle" font-size="9">26</text>
<rect x="207.8" y="178.7" width="38.1" height="71.3" class="accent" fill="currentColor"/>
<text x="226.9" y="172.7" text-anchor="middle" font-size="9">15</text>
<text x="206.8" y="266" text-anchor="middle">63 HZ</text>
<rect x="262.9" y="173.9" width="38.1" height="76.1" fill-opacity="0.85"/>
<text x="281.9" y="167.9" text-anchor="middle" font-size="9">16</text>
<rect x="303.0" y="159.6" width="38.1" height="90.4" class="accent" fill="currentColor"/>
<text x="322.1" y="153.6" text-anchor="middle" font-size="9">19</text>
<text x="302.0" y="266" text-anchor="middle">125 HZ</text>
<rect x="358.1" y="207.2" width="38.1" height="42.8" fill-opacity="0.85"/>
<text x="377.1" y="201.2" text-anchor="middle" font-size="9">9</text>
<rect x="398.2" y="150.1" width="38.1" height="99.9" class="accent" fill="currentColor"/>
<text x="417.2" y="144.1" text-anchor="middle" font-size="9">21</text>
<text x="397.2" y="266" text-anchor="middle">250 HZ</text>
<rect x="453.3" y="250.0" width="38.1" height="1.0" fill-opacity="0.85"/>
<text x="472.4" y="244.0" text-anchor="middle" font-size="9">0</text>
<rect x="493.4" y="131.1" width="38.1" height="118.9" class="accent" fill="currentColor"/>
<text x="512.5" y="125.1" text-anchor="middle" font-size="9">25</text>
<text x="492.4" y="266" text-anchor="middle">1,000 HZ</text>

<title id="t">GE Vernova's gas turbine backlog and slot reservations, March 2025 to September 2026</title>
<desc id="d">Bar chart of the gigawatts of gas power equipment GE Vernova had under contract, firm orders and slot reservations together, at the end of each quarter, by the company's own count: 50 in March 2025, 55 in June 2025, 62 in September 2025, 83 in December 2025, 100 in March 2026, 116 in June 2026 and 122 in September 2026. Data: GE Vernova's quarterly earnings releases filed with the SEC.</desc>

<title id="t">Data centers' share of Dutch electricity use, 2017–2025</title>
<desc id="d">Bar chart of the electricity supplied to data centers in the Netherlands as a share of the country's total electricity consumption, measured by Statistics Netherlands (CBS): 1.5% in 2017, 2.1% in 2018, 2.4% in 2019, 2.8% in 2020, 3.3% in 2021, 4.0% in 2022, 4.2% in 2023, 4.6% in 2024 and 5.0% in 2025, the last figure provisional.</desc>

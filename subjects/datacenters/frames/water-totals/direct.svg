<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">On-site water consumed by US data centers, modeled, 2014–2028</title>
<desc id="d">Bar chart of Lawrence Berkeley National Laboratory's modeled estimate of the water consumed on site by all US data centers, in billions of liters a year: 21.2 in 2014, about 29 in 2018, 66 in 2023, and a projection for 2028 of about 146 at the low end and about 275 at the high end. The 2018 and 2028 values are read from the report's figure 5.9. Data: 2024 United States Data Center Energy Usage Report, figure 5.9.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="540" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">100</text>
<line x1="64" x2="540" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">200</text>
<line x1="64" x2="540" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">300</text>
</g>
<rect x="83.6" y="234.9" width="56" height="15.1" fill-opacity="0.85"/>
<text x="111.6" y="228.9" text-anchor="middle">21.2</text>
<text x="111.6" y="266" text-anchor="middle">2014</text>
<rect x="178.8" y="229.3" width="56" height="20.7" fill-opacity="0.85"/>
<text x="206.8" y="223.3" text-anchor="middle">~29</text>
<text x="206.8" y="266" text-anchor="middle">2018</text>
<rect x="274.0" y="202.9" width="56" height="47.1" class="accent" fill="currentColor"/>
<text x="302.0" y="196.9" text-anchor="middle">66</text>
<text x="302.0" y="266" text-anchor="middle">2023</text>
<rect x="369.2" y="145.9" width="56" height="104.1" fill-opacity="0.85"/>
<text x="397.2" y="139.9" text-anchor="middle">~146</text>
<text x="397.2" y="266" text-anchor="middle">2028</text>
<text x="397.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">LOW</text>
<rect x="464.4" y="53.8" width="56" height="196.2" fill-opacity="0.85"/>
<text x="492.4" y="47.8" text-anchor="middle">~275</text>
<text x="492.4" y="266" text-anchor="middle">2028</text>
<text x="492.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">HIGH</text>
<text x="64" y="20" font-size="12" letter-spacing="1">ON-SITE WATER CONSUMED · BILLION LITERS A YEAR · MODELED</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-labelledby="t d">
<title id="t">PJM capacity auction clearing prices, delivery years 2024/25 to 2028/29</title>
<desc id="d">Bar chart of the price at which PJM's base residual capacity auction cleared across its whole region, in dollars per megawatt-day of unforced capacity: $28.92 for 2024/25, $269.92 for 2025/26, then at the price cap: $329.17 for 2026/27, $333.44 for 2027/28 and $325.00 for 2028/29. Data: PJM, 2028/2029 Base Residual Auction report, table 2.</desc>

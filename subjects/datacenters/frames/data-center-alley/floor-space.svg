<title id="t">Data center floor space standing in Loudoun County, by the year its buildings were finished</title>
<desc id="d">Bar chart, by our arithmetic from Loudoun County's layer of existing data center buildings as of September 1, 2026: the floor area of the buildings standing in 2026 that were finished by the end of each year, in millions of square feet. 2.0 by 2001, 2.0 by 2004, 2.7 by 2007, 4.1 by 2010, 5.1 by 2013, 8.5 by 2016, 16.9 by 2019, 26.6 by 2022 and 36.1 by 2025. Another 15.9 million were under construction.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Estimated expenses in the Dartmouth proposal, 1955</title>
<desc id="d">Bar chart. The proposal's estimated expenses, totalling $13,500: six faculty salaries of $1,200 ($7,200); eight travel and rent allowances averaging $300 ($2,400); two graduate-student salaries of $700 ($1,400); secretarial and organisational expense ($850); additional travel ($600); contingencies ($550). Data: McCarthy, Minsky, Rochester and Shannon, A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence, 31 August 1955.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">$0</text>
<line x1="64" x2="540" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">$2,000</text>
<line x1="64" x2="540" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">$4,000</text>
<line x1="64" x2="540" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">$6,000</text>
<line x1="64" x2="540" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">$8,000</text>
</g>
<rect x="81.7" y="57.4" width="44" height="192.6" class="accent" fill="currentColor"/>
<text x="103.7" y="51.4" text-anchor="middle">$7,200</text>
<text x="103.7" y="266" text-anchor="middle">Salaries</text>
<text x="103.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">6 × $1,200</text>
<rect x="161.0" y="185.8" width="44" height="64.2" fill-opacity="0.85"/>
<text x="183.0" y="179.8" text-anchor="middle">$2,400</text>
<text x="183.0" y="266" text-anchor="middle">Travel</text>
<text x="183.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">8 × ~$300</text>
<rect x="240.3" y="212.6" width="44" height="37.4" fill-opacity="0.85"/>
<text x="262.3" y="206.6" text-anchor="middle">$1,400</text>
<text x="262.3" y="266" text-anchor="middle">Students</text>
<text x="262.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2 × $700</text>
<rect x="319.7" y="227.3" width="44" height="22.7" fill-opacity="0.85"/>
<text x="341.7" y="221.3" text-anchor="middle">$850</text>
<text x="341.7" y="266" text-anchor="middle">Office</text>
<text x="341.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">secretary</text>
<rect x="399.0" y="233.9" width="44" height="16.1" fill-opacity="0.85"/>
<text x="421.0" y="227.9" text-anchor="middle">$600</text>
<text x="421.0" y="266" text-anchor="middle">Visitors</text>
<text x="421.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">travel</text>

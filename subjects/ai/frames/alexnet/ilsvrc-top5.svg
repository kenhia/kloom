<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">ILSVRC image classification: the winning top-5 error, 2010–2017</title>
<desc id="d">Bar chart of the lowest top-5 classification error in each year's ImageNet challenge, with the challenge's training data. 2010, NEC: 28.2%. 2011, XRCE: 25.8%. 2012, SuperVision (AlexNet): 16.4%. 2013, Clarifai: 11.7%. 2014, GoogLeNet: 6.7%. 2015, MSRA (ResNet): 3.57%. 2016, Trimps-Soushen: 2.99%. 2017, WMW: 2.25%. Data: Russakovsky et al. 2015, tables 5–7; He et al. 2015; the ILSVRC 2016 and 2017 results pages.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">10%</text>
<line x1="64" x2="460" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">20%</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">30%</text>
</g>
<rect x="68.8" y="48.8" width="40" height="201.2" fill-opacity="0.85"/>
<text x="88.8" y="42.8" text-anchor="middle">28.2%</text>
<text x="88.8" y="266" text-anchor="middle">2010</text>
<text x="88.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">NEC</text>
<rect x="118.2" y="66.0" width="40" height="184.0" fill-opacity="0.85"/>
<text x="138.2" y="60.0" text-anchor="middle">25.8%</text>
<text x="138.2" y="266" text-anchor="middle">2011</text>
<text x="138.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">XRCE</text>
<rect x="167.8" y="133.0" width="40" height="117.0" class="accent" fill="currentColor"/>
<text x="187.8" y="127.0" text-anchor="middle">16.4%</text>
<text x="187.8" y="266" text-anchor="middle">2012</text>
<text x="187.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">AlexNet</text>
<rect x="217.2" y="166.5" width="40" height="83.5" fill-opacity="0.85"/>
<text x="237.2" y="160.5" text-anchor="middle">11.7%</text>
<text x="237.2" y="266" text-anchor="middle">2013</text>
<text x="237.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Clarifai</text>
<rect x="266.8" y="202.2" width="40" height="47.8" fill-opacity="0.85"/>
<text x="286.8" y="196.2" text-anchor="middle">6.7%</text>
<text x="286.8" y="266" text-anchor="middle">2014</text>
<text x="286.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">Google</text>
<rect x="316.2" y="224.5" width="40" height="25.5" fill-opacity="0.85"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Parameters in five pretrained language models, 2018–2020</title>
<desc id="d">Bar chart on a logarithmic scale. GPT-1 (2018): 117 million parameters. BERT-Large (2018): 340 million. GPT-2 (2019): 1.5 billion. T5 (2019): 11 billion. GPT-3 (2020): 175 billion. Data: each model's paper.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t d">
<title id="t">METR 50% task-completion time horizons of selected frontier models, 2019–2026</title>
<desc id="d">Bar chart on a logarithmic scale of the length of software tasks, measured by how long they take human experts, that each model completes half the time. GPT-2 (2019): about 3 seconds. GPT-3.5 (2022): 36 seconds. GPT-4 (2023): 4 minutes. Claude 3.5 Sonnet (October 2024): 21 minutes. o3 (April 2025): 2.0 hours. Gemini 3 Pro (November 2025): 3.7 hours. GPT-5.2 (December 2025): 5.9 hours. Claude Opus 4.6 (February 2026): 12 hours. Claude Mythos Preview (April 2026): about 17 hours, above the 16 hours METR says its tasks can reliably measure. Data: METR Time Horizon 1.1, May 2026.</desc>

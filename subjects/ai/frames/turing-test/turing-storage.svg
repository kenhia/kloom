<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Storage capacity in Turing's 1950 paper, in binary digits</title>
<desc id="d">Bar chart on a logarithmic scale. Turing's three-state clicking wheel: about 1.6 binary digits. The Manchester computer in 1950: 174,380. A human computer's 100 sheets of 50 lines of 30 digits: about 498,000. Turing's prediction for about the year 2000: about 1,000,000,000 (10 to the 9th). Data: Turing 1950, sections 5 and 6.</desc>
<rect width="480" height="300" fill="#0e2a47"/>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9bb4cf">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="#9bb4cf" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">1</text>
<line x1="64" x2="460" y1="185.8" y2="185.8" stroke="#9bb4cf" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="189.8" text-anchor="end">10³</text>
<line x1="64" x2="460" y1="121.6" y2="121.6" stroke="#9bb4cf" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="125.6" text-anchor="end">10⁶</text>
<line x1="64" x2="460" y1="57.4" y2="57.4" stroke="#9bb4cf" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="61.4" text-anchor="end">10⁹</text>
<rect x="85.5" y="245.6" width="56" height="4.4" fill="#e8f0f8" fill-opacity="0.85"/>
<text x="113.5" y="239.6" text-anchor="middle" fill="#e8f0f8">1.6</text>
<text x="113.5" y="266" text-anchor="middle" fill="#e8f0f8">Wheel</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9">3 states</text>
<rect x="184.5" y="137.8" width="56" height="112.2" fill="#e8f0f8" fill-opacity="0.85"/>
<text x="212.5" y="131.8" text-anchor="middle" fill="#e8f0f8">174,380</text>
<text x="212.5" y="266" text-anchor="middle" fill="#e8f0f8">Manchester</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9">1950</text>
<rect x="283.5" y="128.1" width="56" height="121.9" fill="#e8f0f8" fill-opacity="0.85"/>
<text x="311.5" y="122.1" text-anchor="middle" fill="#e8f0f8">≈498,000</text>
<text x="311.5" y="266" text-anchor="middle" fill="#e8f0f8">100 pages</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9">of digits</text>
<rect x="382.5" y="57.4" width="56" height="192.6" fill="#ffc857" fill-opacity="1"/>
<text x="410.5" y="51.4" text-anchor="middle" fill="#e8f0f8">10⁹</text>
<text x="410.5" y="266" text-anchor="middle" fill="#e8f0f8">Prediction</text>
<text x="410.5" y="280" text-anchor="middle" font-size="9">c. 2000</text>
<text x="64" y="20" font-size="12" fill="#e8f0f8" letter-spacing="1">STORAGE CAPACITY · BINARY DIGITS (LOG SCALE)</text>
</g></svg>

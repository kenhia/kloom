<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">MNIST test error of learning methods without built-in knowledge of image geometry, as reported by Hinton, Osindero and Teh (2006)</title>
<desc id="d">Bar chart of test error on the 10,000 MNIST test digits, permutation-invariant task. Deep belief net 1.25 per cent; support vector machine 1.4; backpropagation net 784-500-300-10, 1.51; backpropagation net 784-800-10, 1.53; nearest neighbour on all 60,000 examples, 2.8. Data: Hinton, Osindero and Teh 2006, table 1.</desc>

<title id="t">Training tokens per parameter in four language models, 2020–2023</title>
<desc id="d">Bar chart on a logarithmic scale. GPT-3 (175 billion parameters, 300 billion tokens): about 1.7 tokens per parameter. Gopher (280 billion, 300 billion): about 1.1. Chinchilla (70 billion, 1.4 trillion): 20. LLaMA 7B (6.7 billion, 1 trillion): about 150. Data: Hoffmann et al. 2022, table 1; Touvron et al. 2023, table 2.</desc>

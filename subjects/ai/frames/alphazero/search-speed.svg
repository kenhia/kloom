<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Positions searched per second: AlphaZero against Stockfish and Elmo (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale. Stockfish 8 searched about 70 million positions a second in chess and Elmo about 35 million in shogi; AlphaZero searched about 80 thousand in chess and 40 thousand in shogi. Data: Silver et al. 2017, arXiv:1712.01815, table S4.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">1K</text>
<line x1="64" x2="460" y1="178.7" y2="178.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="182.7" text-anchor="end">100K</text>
<line x1="64" x2="460" y1="107.3" y2="107.3" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="111.3" text-anchor="end">10M</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">1B</text>
</g>
<rect x="85.5" y="77.2" width="56" height="172.8" fill-opacity="0.85"/>
<text x="113.5" y="71.2" text-anchor="middle">70M</text>
<text x="113.5" y="266" text-anchor="middle">Stockfish</text>
<text x="113.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">chess</text>
<rect x="184.5" y="182.1" width="56" height="67.9" class="accent" fill="currentColor"/>
<text x="212.5" y="176.1" text-anchor="middle">80K</text>
<text x="212.5" y="266" text-anchor="middle">AlphaZero</text>
<text x="212.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">chess</text>
<rect x="283.5" y="87.9" width="56" height="162.1" fill-opacity="0.85"/>
<text x="311.5" y="81.9" text-anchor="middle">35M</text>
<text x="311.5" y="266" text-anchor="middle">Elmo</text>
<text x="311.5" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">shogi</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Hepatitis after transfusion in the NIH's prospective studies, 1967–1990s</title>
<desc id="d">Bar chart. Share of transfusion recipients who developed hepatitis: about 33% around 1970, when paid blood was untested; about 10% after volunteers and HBsAg screening; 4% by 1989; 1.5% after the first hepatitis C antibody test in 1990; close to zero after the second-generation test of 1992. Data: Alter and Klein, Blood 112 (2008): 2618–19.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="500" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="500" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">10%</text>
<line x1="64" x2="500" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">20%</text>
<line x1="64" x2="500" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">30%</text>
<line x1="64" x2="500" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">40%</text>
</g>
<rect x="79.6" y="73.4" width="56" height="176.6" class="accent" fill="currentColor"/>
<text x="107.6" y="67.4" text-anchor="middle">33%</text>
<text x="107.6" y="266" text-anchor="middle">1967–70</text>
<text x="107.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">paid, untested</text>
<rect x="166.8" y="196.5" width="56" height="53.5" fill-opacity="0.85"/>
<text x="194.8" y="190.5" text-anchor="middle">10%</text>
<text x="194.8" y="266" text-anchor="middle">1970s–80s</text>
<text x="194.8" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">HBsAg test</text>
<rect x="254.0" y="228.6" width="56" height="21.4" fill-opacity="0.85"/>
<text x="282.0" y="222.6" text-anchor="middle">4%</text>
<text x="282.0" y="266" text-anchor="middle">1989</text>
<text x="282.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">surrogates</text>
<rect x="341.2" y="242.0" width="56" height="8.0" fill-opacity="0.85"/>
<text x="369.2" y="236.0" text-anchor="middle">1.5%</text>
<text x="369.2" y="266" text-anchor="middle">1990–91</text>
<text x="369.2" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">anti-HCV</text>
<rect x="428.4" y="250.0" width="56" height="1.0" fill-opacity="0.85"/>
<text x="456.4" y="244.0" text-anchor="middle">≈0</text>
<text x="456.4" y="266" text-anchor="middle">1992 on</text>
<text x="456.4" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">2nd gen.</text>
<text x="64" y="20" font-size="12" letter-spacing="1">RECIPIENTS WITH HEPATITIS AFTER TRANSFUSION, NIH</text>
</g></svg>

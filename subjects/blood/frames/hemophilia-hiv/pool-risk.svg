<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Chance that a plasma pool holds an infected donation (log scale)</title>
<desc id="d">Bar chart on a logarithmic scale of the chance, in per cent, that a pool contains at least one infected donation when, by an invented rate, one donation in 10,000 carries a virus no test can find: computed as 1 − (1 − 1/10,000) to the power of the pool size. One donation, 0.01 per cent; a cryoprecipitate pool of 15, 0.15 per cent; a concentrate pool of 1,000, 9.5 per cent; 5,000, 39 per cent; 20,000, 86 per cent; 30,000, 95 per cent. Pool sizes from the Institute of Medicine (1995) and the Infected Blood Inquiry (2024); the arithmetic is the reading's own.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="227.6" y2="227.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="231.6" text-anchor="end">0.01%</text>
<line x1="64" x2="540" y1="184.8" y2="184.8" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="188.8" text-anchor="end">0.1%</text>
<line x1="64" x2="540" y1="142.0" y2="142.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="146.0" text-anchor="end">1%</text>
<line x1="64" x2="540" y1="99.2" y2="99.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="103.2" text-anchor="end">10%</text>
<line x1="64" x2="540" y1="56.4" y2="56.4" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="60.4" text-anchor="end">100%</text>
</g>
<rect x="77.7" y="227.6" width="52" height="22.4" fill-opacity="0.85"/>
<text x="103.7" y="221.6" text-anchor="middle">0.01%</text>
<text x="103.7" y="266" text-anchor="middle">1</text>
<text x="103.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">one donor</text>
<rect x="157.0" y="177.3" width="52" height="72.7" fill-opacity="0.85"/>
<text x="183.0" y="171.3" text-anchor="middle">0.15%</text>
<text x="183.0" y="266" text-anchor="middle">15</text>
<text x="183.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">cryo pool</text>
<rect x="236.3" y="100.1" width="52" height="149.9" fill-opacity="0.85"/>
<text x="262.3" y="94.1" text-anchor="middle">9.5%</text>
<text x="262.3" y="266" text-anchor="middle">1,000</text>
<text x="262.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">donors</text>
<rect x="315.7" y="73.8" width="52" height="176.2" fill-opacity="0.85"/>
<text x="341.7" y="67.8" text-anchor="middle">39%</text>
<text x="341.7" y="266" text-anchor="middle">5,000</text>
<text x="341.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">donors</text>
<rect x="395.0" y="59.1" width="52" height="190.9" class="accent" fill="currentColor"/>
<text x="421.0" y="53.1" text-anchor="middle">86%</text>
<text x="421.0" y="266" text-anchor="middle">20,000</text>
<text x="421.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">donors</text>
<rect x="474.3" y="57.4" width="52" height="192.6" fill-opacity="0.85"/>
<text x="500.3" y="51.4" text-anchor="middle">95%</text>
<text x="500.3" y="266" text-anchor="middle">30,000</text>
<text x="500.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">donors</text>
<text x="64" y="20" font-size="12" letter-spacing="1">ONE DONATION IN 10,000 INFECTED (INVENTED) · LOG SCALE</text>
</g></svg>

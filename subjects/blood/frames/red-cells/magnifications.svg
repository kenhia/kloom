<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Magnifying powers of the 26 Leeuwenhoek microscopes Henry Baker examined</title>
<desc id="d">Bar chart of how many of the 26 single-lens microscopes that Antonie van Leeuwenhoek left to the Royal Society magnified the diameter of an object by each power: one at 40 times, one at 53, two at 57, three at 66, two at 72, eight at 80, three at 89, three at 100, one at 114, one at 133 and one at 160. Source: Henry Baker, Employment for the Microscope (London, 1753), pp. 434–436.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Hepatitis B surface antigen in paid and volunteer blood, early 1970s</title>
<desc id="d">Bar chart. Units found reactive for hepatitis B surface antigen per 1,000 tested: about 14.1 of 48,502 units from paid donors (685 reactive) and 2.2 of 83,196 units from volunteer donors (182 reactive). Data: Food and Drug Administration, proposed rule, Federal Register 40 (14 November 1975): 53040–41; rates by our arithmetic.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="460" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="460" y1="196.5" y2="196.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="200.5" text-anchor="end">4</text>
<line x1="64" x2="460" y1="143.0" y2="143.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="147.0" text-anchor="end">8</text>
<line x1="64" x2="460" y1="89.5" y2="89.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="93.5" text-anchor="end">12</text>
<line x1="64" x2="460" y1="36.0" y2="36.0" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="40.0" text-anchor="end">16</text>
</g>
<rect x="135.0" y="61.4" width="56" height="188.6" class="accent" fill="currentColor"/>
<text x="163.0" y="55.4" text-anchor="middle">14.1</text>
<text x="163.0" y="266" text-anchor="middle">Paid</text>
<text x="163.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">48,502 units</text>
<rect x="333.0" y="220.6" width="56" height="29.4" fill-opacity="0.85"/>
<text x="361.0" y="214.6" text-anchor="middle">2.2</text>
<text x="361.0" y="266" text-anchor="middle">Volunteer</text>
<text x="361.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">83,196 units</text>
<text x="64" y="20" font-size="12" letter-spacing="1">HBsAg-REACTIVE UNITS PER 1,000 TESTED</text>

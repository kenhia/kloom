<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Units of whole blood shipped to Vietnam each year by the 406th Medical Laboratory, 1966 to 1970</title>
<desc id="d">Bar chart of the units of whole blood shipped to the central blood bank in Vietnam by the 406th Medical Laboratory in Japan, blood collected in the United States and in the Pacific: 1966, 115,869; 1967, 213,022; 1968, 351,519; 1969, 348,409; 1970 (January to November), 59,175. Total 1,087,994. Data: Neel, Medical Support of the U.S. Army in Vietnam 1965-1970 (1973), table 9.</desc>

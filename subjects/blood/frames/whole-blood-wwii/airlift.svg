<title id="t">Whole blood flown to the European theater each month, August 1944 to May 1945</title>
<desc id="d">Bar chart of the pints of group O whole blood shipped each month from the United States to the European theater by the Army Whole Blood Procurement Service. August 1944 (from the 21st), 3,581; September, 15,811; October, 16,884; November, 22,769; December, 26,290; January 1945, 28,847; February, 25,268; March, 30,510; April, 24,407; May (to the 10th), 6,738. Total 201,105. Data: Kendrick, Blood Program in World War II (1964), table 20.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">The window period for HIV and hepatitis C, by screening test</title>
<desc id="d">Bar chart of the window period, in days from the time a donation can first infect until each test detects the infection. HIV: antibody tests then in use, 45 days (an estimate by Petersen and colleagues, 1994); p24 antigen, 15; minipool nucleic acid test, 9; single-donation test, 5.6. Hepatitis C: antibody, 58; minipool test, 7.4; single-donation test, 4.9. All but the first are from the model of Busch and colleagues (2005), several as sums of its intervals.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="540" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="540" y1="188.9" y2="188.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="192.9" text-anchor="end">20</text>
<line x1="64" x2="540" y1="127.7" y2="127.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="131.7" text-anchor="end">40</text>
<line x1="64" x2="540" y1="66.6" y2="66.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="70.6" text-anchor="end">60</text>
</g>
<rect x="75.0" y="112.4" width="46" height="137.6" fill-opacity="0.85"/>
<text x="98.0" y="106.4" text-anchor="middle">45</text>
<text x="98.0" y="266" text-anchor="middle">HIV</text>
<text x="98.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">antibody</text>
<rect x="143.0" y="204.1" width="46" height="45.9" fill-opacity="0.85"/>
<text x="166.0" y="198.1" text-anchor="middle">15</text>
<text x="166.0" y="266" text-anchor="middle">HIV</text>
<text x="166.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">p24</text>
<rect x="211.0" y="222.5" width="46" height="27.5" class="accent" fill="currentColor"/>
<text x="234.0" y="216.5" text-anchor="middle">9</text>
<text x="234.0" y="266" text-anchor="middle">HIV</text>
<text x="234.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">pool NAT</text>
<rect x="279.0" y="232.9" width="46" height="17.1" fill-opacity="0.85"/>
<text x="302.0" y="226.9" text-anchor="middle">5.6</text>
<text x="302.0" y="266" text-anchor="middle">HIV</text>
<text x="302.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">single</text>
<rect x="347.0" y="72.7" width="46" height="177.3" fill-opacity="0.85"/>
<text x="370.0" y="66.7" text-anchor="middle">58</text>
<text x="370.0" y="266" text-anchor="middle">HCV</text>
<text x="370.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">antibody</text>
<rect x="415.0" y="227.4" width="46" height="22.6" class="accent" fill="currentColor"/>
<text x="438.0" y="221.4" text-anchor="middle">7.4</text>
<text x="438.0" y="266" text-anchor="middle">HCV</text>
<text x="438.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">pool NAT</text>
<rect x="483.0" y="235.0" width="46" height="15.0" fill-opacity="0.85"/>
<text x="506.0" y="229.0" text-anchor="middle">4.9</text>
<text x="506.0" y="266" text-anchor="middle">HCV</text>
<text x="506.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">single</text>
<text x="64" y="20" font-size="12" letter-spacing="1">DAYS AN INFECTION GOES UNSEEN · HIV AND HEPATITIS C</text>
</g></svg>

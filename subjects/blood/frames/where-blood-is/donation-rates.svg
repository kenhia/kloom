<title id="t">Blood donations per 1,000 people, by country income group</title>
<desc id="d">Bar chart of the median whole-blood donation rate per 1,000 people in 2023, from the World Health Organization's fact sheet on blood safety and availability (June 2026): high-income countries 28.9, upper-middle-income 18.2, lower-middle-income 8.5 and low-income 4.5.</desc>

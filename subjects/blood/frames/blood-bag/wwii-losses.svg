<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
<title id="t">Causes of the 204,848 bottles of blood lost in the American Red Cross plasma programme, World War II</title>
<desc id="d">Bar chart of bottles of blood lost before or during processing, of 12,589,034 delivered to plasma processing laboratories in World War II: bacterial contamination 125,748; positive serology 28,364; miscellaneous 20,734; breakage in the centrifuge 17,048; hemolysis 7,567; clotting 3,727; breakage in transit 1,660. Data: Kendrick, Blood Program in World War II (1964), table 8, p. 306, from the final report of the American Red Cross.</desc>
<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="currentColor">
<g class="muted">
<line x1="64" x2="620" y1="250.0" y2="250.0" stroke="currentColor" stroke-opacity="0.9" stroke-width="1"/>
<text x="56" y="254.0" text-anchor="end">0</text>
<line x1="64" x2="620" y1="188.9" y2="188.9" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="192.9" text-anchor="end">40,000</text>
<line x1="64" x2="620" y1="127.7" y2="127.7" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="131.7" text-anchor="end">80,000</text>
<line x1="64" x2="620" y1="66.6" y2="66.6" stroke="currentColor" stroke-opacity="0.3" stroke-width="0.6"/>
<text x="56" y="70.6" text-anchor="end">120,000</text>
</g>
<rect x="77.7" y="57.8" width="52" height="192.2" class="accent" fill="currentColor"/>
<text x="103.7" y="51.8" text-anchor="middle">125,748</text>
<text x="103.7" y="266" text-anchor="middle">Bacteria</text>
<text x="103.7" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">contamination</text>
<rect x="157.1" y="206.6" width="52" height="43.4" fill-opacity="0.85"/>
<text x="183.1" y="200.6" text-anchor="middle">28,364</text>
<text x="183.1" y="266" text-anchor="middle">Syphilis</text>
<text x="183.1" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">test positive</text>
<rect x="236.6" y="218.3" width="52" height="31.7" fill-opacity="0.85"/>
<text x="262.6" y="212.3" text-anchor="middle">20,734</text>
<text x="262.6" y="266" text-anchor="middle">Other</text>
<text x="262.6" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">causes</text>
<rect x="316.0" y="223.9" width="52" height="26.1" fill-opacity="0.85"/>
<text x="342.0" y="217.9" text-anchor="middle">17,048</text>
<text x="342.0" y="266" text-anchor="middle">Broken</text>
<text x="342.0" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">in centrifuge</text>
<rect x="395.4" y="238.4" width="52" height="11.6" fill-opacity="0.85"/>
<text x="421.4" y="232.4" text-anchor="middle">7,567</text>
<text x="421.4" y="266" text-anchor="middle">Hemolysis</text>
<rect x="474.9" y="244.3" width="52" height="5.7" fill-opacity="0.85"/>
<text x="500.9" y="238.3" text-anchor="middle">3,727</text>
<text x="500.9" y="266" text-anchor="middle">Clotting</text>
<rect x="554.3" y="247.5" width="52" height="2.5" fill-opacity="0.85"/>
<text x="580.3" y="241.5" text-anchor="middle">1,660</text>
<text x="580.3" y="266" text-anchor="middle">Broken</text>
<text x="580.3" y="280" text-anchor="middle" font-size="9" class="muted" fill="currentColor">in transit</text>
<text x="64" y="20" font-size="12" letter-spacing="1">BOTTLES LOST, BY CAUSE (OF 12.6 MILLION)</text>
</g></svg>

<title id="t">Horses and mules against tractors on American farms, 1910 to 1960</title>
<desc id="d">Line chart, in millions. Horses and mules: 24.2 in 1910, 26.5 in 1915, a peak of 26.7 in 1918, 25.7 in 1920, 22.6 in 1925, 19.1 in 1930, 16.7 in 1935, 14.5 in 1940, 12.0 in 1945, 7.8 in 1950, 4.3 in 1955 and 3.1 in 1960. Tractors: about 0.001 in 1910, 0.03 in 1915, 0.25 in 1920, 0.55 in 1925, 0.92 in 1930, 1.05 in 1935, 1.57 in 1940, 2.35 in 1945, 3.39 in 1950, 4.35 in 1955 and 4.69 in 1960. Data: Historical Statistics of the United States, Colonial Times to 1970, series K 184, K 570 and K 572.</desc>

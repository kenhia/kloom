<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Mace from the Banda Islands a year, before and after the conquest of 1621</title>
<desc id="d">Bar chart of estimates of the mace the Banda Islands yielded in a year, in thousands of Amsterdam pounds (about 494 grams each), as compiled and converted by Miske (2025). Tomé Pires, about 1515: 275 to 330 thousand. Andrés de Urdaneta, 1537: 137.5 thousand. Gijsels, for the years before 1621, as Miske converts his figures: 367.5 thousand. The Dutch East India Company's exports, averaged over 1630 to 1634: 195 thousand. The colonial figure is exports, not the harvest.</desc>

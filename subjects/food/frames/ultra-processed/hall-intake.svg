<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Daily energy intake in Hall's trial, by diet and week</title>
<desc id="d">Bar chart of mean daily energy intake, in kilocalories, of 19 inpatients at the NIH Clinical Center over the doubly labeled water measurement periods: on the ultra-processed diet 3,099 in week 1 and 2,865 in week 2; on the unprocessed diet 2,555 in week 1 and 2,486 in week 2. Data: Hall et al. 2019, Table 2.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Identified animal bones from Göbekli Tepe, by species</title>
<desc id="d">Bar chart of the number of identified specimens (NISP) from the central area of Göbekli Tepe, excavations 1996–2001: goitered gazelle 7,949; aurochs 2,574; wild sheep 1,237; Asiatic wild ass 1,177; fox 971; wild boar 863; Cape hare 386; red deer 170. Data: Peters and Schmidt 2004, table 1.</desc>
